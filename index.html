<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ross Family Basecamp Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
      :root {
          --sky-top: #20344a;
          --sky-mid: #45627a;
          --sky-bottom: #e6d0a8;
          --pine-deep: #173126;
          --pine-mid: #28503d;
          --pine-light: #3d6c52;
          --wood-dark: #5f3f29;
          --wood-mid: #8a5d3b;
          --wood-light: #b98255;
          --paper: #f6ecd8;
          --paper-shadow: #d9c2a0;
          --ink: #2c2117;
          --snow: rgba(255, 250, 240, 0.85);
      }

      body {
          font-family: "Nunito", sans-serif;
          background: #284157;
          background:
              radial-gradient(circle at top, rgba(255, 244, 214, 0.35), transparent 30%),
              linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
          padding: 18px 12px 28px;
          margin: 0;
          min-height: 100vh;
          position: relative;
          overflow-x: hidden;
          color: var(--ink);
      }

      body::before,
      body::after {
          content: "";
          position: fixed;
          left: 0;
          width: 100%;
          pointer-events: none;
      }

      body::before {
          bottom: 0;
          height: 44vh;
          background:
              linear-gradient(160deg, transparent 0 16%, rgba(14, 28, 20, 0.9) 16% 18%, transparent 18% 26%, rgba(14, 28, 20, 0.88) 26% 29%, transparent 29% 38%, rgba(14, 28, 20, 0.92) 38% 42%, transparent 42%),
              linear-gradient(175deg, transparent 0 8%, rgba(29, 54, 41, 0.95) 8% 12%, transparent 12% 20%, rgba(29, 54, 41, 0.95) 20% 24%, transparent 24% 32%, rgba(29, 54, 41, 0.94) 32% 36%, transparent 36%),
              linear-gradient(180deg, transparent 0 24%, #3d5f4f 24% 55%, #274233 55% 100%);
          opacity: 0.95;
          z-index: 0;
      }

      body::after {
          top: 0;
          height: 36vh;
          background:
              radial-gradient(circle at 82% 18%, rgba(255, 239, 201, 0.78) 0 9%, transparent 10%),
              linear-gradient(180deg, rgba(255,255,255,0.10), transparent 42%);
          z-index: 0;
      }

      h1 {
          font-family: "Abril Fatface", serif;
          font-size: 2.8rem;
          text-align: center;
          color: #fff7eb;
          margin: 0;
          letter-spacing: 0.03em;
          text-shadow: 0 4px 16px rgba(0,0,0,0.34);
      }

      .hero {
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 1100px;
          margin: 0 auto 20px;
          padding: 20px 14px 10px;
      }

      .hero-subtitle {
          color: rgba(255, 244, 228, 0.88);
          font-size: 1rem;
          font-weight: 700;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          margin-top: 8px;
      }

      .floating-flake {
          position: fixed;
          top: -10px;
          color: var(--snow);
          font-size: 1rem;
          pointer-events: none;
          -webkit-animation: drift linear infinite;
          animation: drift linear infinite;
          opacity: 0.7;
          z-index: 2;
      }

      @-webkit-keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          15% { opacity: 0.75; }
          100% {
              -webkit-transform: translateY(100vh) translateX(35px);
              transform: translateY(100vh) translateX(35px);
              opacity: 0.15;
          }
      }

      @keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          15% { opacity: 0.75; }
          100% {
              -webkit-transform: translateY(100vh) translateX(35px);
              transform: translateY(100vh) translateX(35px);
              opacity: 0.15;
          }
      }

      .chores-container {
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 1600px;
          margin: 0 auto;
          padding: 0 10px;
          overflow: hidden;
      }

      .chore-card {
          background:
              linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0)),
              linear-gradient(145deg, #f8efd9, var(--paper));
          border-radius: 22px;
          -webkit-border-radius: 22px;
          padding: 16px 16px 18px;
          box-shadow: 0 16px 34px rgba(22, 28, 26, 0.28);
          -webkit-box-shadow: 0 16px 34px rgba(22, 28, 26, 0.28);
          border: 1px solid rgba(111, 77, 49, 0.35);
          -webkit-transition: all 0.25s ease;
          transition: all 0.25s ease;
          width: 300px;
          margin: 8px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          position: relative;
      }

      .chore-card::before {
          content: "";
          position: absolute;
          left: 14px;
          right: 14px;
          top: 10px;
          height: 10px;
          border-radius: 999px;
          background: linear-gradient(90deg, var(--wood-dark), var(--wood-light), var(--wood-dark));
          opacity: 0.8;
      }

      .chore-card:hover {
          -webkit-transform: translateY(-4px);
          transform: translateY(-4px);
          box-shadow: 0 20px 40px rgba(22, 28, 26, 0.36);
          -webkit-box-shadow: 0 20px 40px rgba(22, 28, 26, 0.36);
          border-color: rgba(95, 63, 41, 0.55);
      }

      .kid-profile {
          margin-bottom: 14px;
          overflow: hidden;
          padding-top: 12px;
      }

      .kid-avatar {
          width: 80px;
          height: 80px;
          border-radius: 50%;
          -webkit-border-radius: 50%;
          object-fit: cover;
          border: 4px solid #f3ddbf;
          box-shadow: 0 8px 18px rgba(63, 44, 24, 0.25);
          -webkit-box-shadow: 0 8px 18px rgba(63, 44, 24, 0.25);
          float: left;
          margin-right: 16px;
      }

      .kid-name {
          font-family: "Abril Fatface", serif;
          font-size: 1.45rem;
          font-weight: 400;
          padding: 8px 16px;
          border-radius: 14px;
          -webkit-border-radius: 14px;
          color: #fff6eb;
          display: inline-block;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 5px 12px rgba(0,0,0,0.18);
          -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 5px 12px rgba(0,0,0,0.18);
          margin-top: 18px;
          letter-spacing: 0.02em;
      }

      .Ellie { background: linear-gradient(135deg, #8c4d2a, #bf8250); }
      .Brooklyn { background: linear-gradient(135deg, #7b3f1d, #a56438); }
      .Hazel { background: linear-gradient(135deg, #82633f, #ba9259); }
      .Maverick { background: linear-gradient(135deg, #5a4d34, #8a7450); }
      .Hinckley { background: linear-gradient(135deg, #2f5c4a, #4d7f68); }
      .Adaline { background: linear-gradient(135deg, #536d7e, #7f94a6); }
      .Raleigh { background: linear-gradient(135deg, #6c5a46, #9c8465); }

      ul {
          margin: 0;
          padding-left: 20px;
      }

      li {
          margin-bottom: 7px;
          font-size: 1.06rem;
          line-height: 1.35;
      }

      .chore-list-title {
          font-family: "Nunito", sans-serif;
          font-size: 0.86rem;
          color: #735235;
          margin-bottom: 10px;
          text-transform: uppercase;
          letter-spacing: 0.18em;
          font-weight: 800;
      }

      .quote-section {
          position: relative;
          z-index: 1;
          text-align: center;
          margin: 16px auto 0;
          padding: 16px 18px 12px;
          max-width: 960px;
          background: rgba(53, 41, 30, 0.28);
          border: 1px solid rgba(255, 242, 224, 0.18);
          border-radius: 22px;
          -webkit-border-radius: 22px;
          backdrop-filter: blur(6px);
      }

      .quote {
          font-family: "Abril Fatface", serif;
          font-size: 1.4rem;
          color: #fff7eb;
          text-shadow: 0 2px 4px rgba(0,0,0,0.3);
          margin-bottom: 6px;
      }

      .quote-emphasis {
          font-style: normal;
          font-weight: 700;
          color: #ffd58b;
          text-decoration: underline;
          text-decoration-color: rgba(255, 213, 139, 0.45);
          text-shadow: 0 2px 4px rgba(0,0,0,0.35);
      }

      .quote-author {
          font-family: "Nunito", sans-serif;
          font-size: 0.95rem;
          color: rgba(255, 246, 235, 0.84);
          font-weight: 700;
          text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      }

      @media (max-width: 720px) {
          h1 {
              font-size: 2.25rem;
          }

          .hero-subtitle {
              font-size: 0.82rem;
              letter-spacing: 0.16em;
          }

          .chore-card {
              width: auto;
              display: block;
              margin: 10px auto;
              max-width: 340px;
          }
      }
  </style>
</head>
<body>

<div class="hero">
  <h1>Ross Family Chores</h1>
</div>

<div class="chores-container" id="choresContainer">
  <!-- Cards will be generated by JavaScript -->
</div>

<div class="quote-section">
  <div class="quote">"The God on the mountain is still God in the valley"</div>
  <div class="quote-author">-Toby Mac</div>
</div>

<script>
  var KIDS = [
    { name: "Ellie", chores: ["Stainless steel", "Garage-including bag of softball drinks"] },
    { name: "Brooklyn", chores: ["Kids bathroom", "Toy cubbies"] },
    { name: "Hazel", chores: ["Kitchen bathroom", "Scoop"] },
    { name: "Maverick", chores: ["Garbages"] },
    { name: "Hinckley", chores: ["Clean out Van", "Vacuum Van"] },
    { name: "Adaline", chores: ["Shoe basket", "Garage"] },
    { name: "Raleigh", chores: ["Shoe basket", "Room"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    // Clear existing cards safely
    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];

      // Create card
      var card = document.createElement("div");
      card.setAttribute("class", "chore-card");

      // Create profile section
      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      // Create avatar image
      var avatar = document.createElement("img");
      avatar.setAttribute("src", kid.name + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      // Create name badge
      var nameDiv = document.createElement("div");
      nameDiv.setAttribute("class", "kid-name " + kid.name);
      nameDiv.textContent = kid.name;

      profileDiv.appendChild(avatar);
      profileDiv.appendChild(nameDiv);

      // Create chores section
      var choresDiv = document.createElement("div");
      var choreTitle = document.createElement("div");
      choreTitle.setAttribute("class", "chore-list-title");
      choreTitle.textContent = "Chores";
      choresDiv.appendChild(choreTitle);

      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");
        li.textContent = kid.chores[j];
        ul.appendChild(li);
      }
      choresDiv.appendChild(ul);

      // Assemble card
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();

  // Create drifting snow for a light cabin feel.
  try {
    var MAX_FLAKES = 20;
    var flakeCount = 0;
    var flakes = ['•', '✦', '•', '·'];

    function createFlake() {
      try {
        if (flakeCount >= MAX_FLAKES) {
          return;
        }
        if (typeof document.hidden !== 'undefined' && document.hidden) {
          return;
        }

        var flake = document.createElement('div');
        flake.setAttribute('class', 'floating-flake');
        flake.textContent = flakes[Math.floor(Math.random() * flakes.length)];
        flake.style.left = Math.random() * 100 + 'vw';
        var duration = Math.random() * 4 + 6;
        flake.style.animationDuration = duration + 's';
        flake.style.fontSize = (Math.random() * 0.5 + 0.8) + 'rem';
        document.body.appendChild(flake);
        flakeCount++;

        setTimeout(function() {
          if (flake.parentNode) {
            flake.parentNode.removeChild(flake);
            flakeCount--;
          }
        }, (duration + 0.5) * 1000);
      } catch (e) {
        // Silently fail - animation is non-essential
      }
    }

    setInterval(createFlake, 550);
  } catch (e) {
    // Animation not supported - table will still work
  }

</script>

</body>
</html>
