<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <style>
      :root {
          --page-bg: #fff6f8;
          --panel-bg: #ffffff;
          --panel-border: #ecd6de;
          --text-strong: #18212b;
          --text-muted: #6a5963;
          --accent: #b6577c;
          --accent-soft: #fff0f5;
          --bullet-bg: #fde1ea;
          --shadow: rgba(68, 30, 49, 0.10);
          --banner-bg: #fff1f6;
          --banner-border: #efc6d6;
          --photo-bg: #fff8fb;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
          background: var(--page-bg);
          color: var(--text-strong);
          font-family: Arial, Helvetica, sans-serif;
      }

      body {
          padding: 16px 14px 22px;
          background:
              linear-gradient(180deg, #fff8fa 0%, #fff1f5 100%);
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          background: linear-gradient(180deg, #fffafc 0%, #fff1f5 100%);
          border: 2px solid #ebc2d2;
          border-radius: 18px;
          padding: 20px 24px;
          box-shadow: 0 10px 26px rgba(68, 30, 49, 0.12);
          margin-bottom: 16px;
      }

      .page-title {
          margin: 0 0 8px;
          font-size: 2.5rem;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: 0;
      }

      .birthday-note {
          margin: 0;
          font-size: 1.15rem;
          line-height: 1.35;
          color: var(--text-muted);
          font-weight: 600;
      }

      .birthday-collage {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 12px;
          margin-top: 18px;
      }

      .photo-feature {
          width: 152px;
          height: 182px;
          position: relative;
          overflow: hidden;
          border-radius: 16px;
          border: 2px solid #ebc2d2;
          background: var(--photo-bg);
          box-shadow: 0 10px 24px rgba(68, 30, 49, 0.14);
      }

      .photo-feature img,
      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
      }

      .photo-feature img {
          object-position: center 14%;
      }

      .photo-feature-label {
          position: absolute;
          left: 8px;
          right: 8px;
          bottom: 8px;
          padding: 6px 8px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.92);
          color: var(--accent);
          font-size: 0.82rem;
          line-height: 1.2;
          font-weight: 700;
          text-align: center;
      }

      .photo-bubble {
          width: 152px;
          height: 182px;
          overflow: hidden;
          border-radius: 16px;
          border: 2px solid #ebc2d2;
          background: var(--photo-bg);
          box-shadow: 0 10px 24px rgba(68, 30, 49, 0.14);
      }

      .photo-bubble-1 img {
          object-position: center 26%;
      }

      .photo-bubble-2 img {
          object-position: 50% 24%;
      }

      .photo-bubble-3 img {
          object-position: center 16%;
      }

      .photo-bubble-4 img {
          object-position: center 12%;
      }

      .chores-container {
          display: flex;
          flex-wrap: wrap;
          margin: 0 -6px;
      }

      .chore-card {
          width: calc(25% - 12px);
          margin: 0 6px 12px;
          background: linear-gradient(180deg, #ffffff 0%, #fff8fb 100%);
          border: 2px solid #ead6de;
          border-radius: 18px;
          padding: 18px;
          box-shadow: 0 10px 24px rgba(68, 30, 49, 0.10);
      }

      .kid-profile {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 14px;
          min-width: 0;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          flex: 0 0 auto;
          border: 4px solid #ffffff;
          box-shadow: 0 6px 16px rgba(18, 31, 45, 0.18);
      }

      .kid-text {
          min-width: 0;
      }

      .kid-name {
          margin: 0 0 4px;
          font-size: 1.9rem;
          line-height: 1;
          font-weight: 700;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          margin-bottom: 9px;
          font-size: 1.08rem;
          line-height: 1.28;
          font-weight: 700;
          word-break: break-word;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          flex: 0 0 auto;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          background: var(--bullet-bg);
          color: var(--accent);
          font-size: 0.9rem;
          font-weight: 700;
      }

      .empty-state {
          background: var(--panel-bg);
          border: 1px solid var(--panel-border);
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 20px var(--shadow);
          font-size: 1rem;
          font-weight: 600;
          color: var(--text-muted);
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 10px 10px 14px;
          }

          .page-header {
              border-radius: 16px;
              padding: 16px 20px;
              margin-bottom: 12px;
          }

          .page-title {
              font-size: 2.35rem;
              margin-bottom: 6px;
          }

          .birthday-note {
              font-size: 1rem;
          }

          .birthday-collage {
              gap: 10px;
              margin-top: 14px;
          }

          .photo-feature {
              width: 132px;
              height: 158px;
              border-radius: 14px;
          }

          .photo-feature-label {
              left: 6px;
              right: 6px;
              bottom: 6px;
              padding: 5px 6px;
              font-size: 0.72rem;
          }

          .photo-bubble {
              width: 132px;
              height: 158px;
              border-radius: 14px;
          }

          .chores-container {
              margin: 0 -5px;
          }

          .chore-card {
              width: calc(25% - 10px);
              margin: 0 5px 10px;
              border-radius: 16px;
              padding: 16px;
          }

          .kid-profile {
              gap: 12px;
              margin-bottom: 12px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.8rem;
          }

          li {
              gap: 8px;
              margin-bottom: 8px;
              font-size: 1rem;
              line-height: 1.22;
          }

          .chore-bullet {
              width: 28px;
              height: 28px;
              font-size: 0.8rem;
          }
      }

      @media (max-width: 1100px) {
          .photo-feature {
              width: 112px;
              height: 132px;
          }

          .photo-bubble {
              width: 112px;
              height: 132px;
          }

          .chore-card {
              width: calc(50% - 12px);
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 16px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .birthday-note {
              font-size: 0.92rem;
          }

          .birthday-collage {
              gap: 8px;
              margin-top: 8px;
          }

          .photo-feature {
              width: 110px;
              height: 128px;
          }

          .photo-bubble {
              width: 110px;
              height: 128px;
          }

          .chores-container {
              display: block;
              margin: 0;
          }

          .chore-card {
              width: auto;
              margin: 0 0 12px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .photo-feature {
              width: 84px;
              height: 96px;
          }

          .photo-bubble {
              width: 84px;
              height: 96px;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.45rem;
          }

          li {
              font-size: 0.84rem;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title">Ross Family Chores</h1>
    <p class="birthday-note">Happy Birthday, Ellie!</p>
  </section>

  <div class="chores-container" id="choresContainer"></div>

  <section class="birthday-collage" aria-label="Birthday photos for Ellie">
    <div class="photo-bubble photo-bubble-2"><img src="ellie-bday-2.png" alt="Ellie birthday photo"></div>
    <div class="photo-bubble photo-bubble-3"><img src="ellie-bday-3.png" alt="Ellie birthday photo"></div>
    <div class="photo-feature">
      <img src="ellie-bday-4.png" alt="Ellie wearing a birthday queen sash">
      <div class="photo-feature-label">Birthday Queen</div>
    </div>
    <div class="photo-bubble photo-bubble-4"><img src="ellie-bday-5.png" alt="Ellie birthday photo"></div>
  </section>
</div>

<script>
  var KIDS = [
    { name: "Ellie", chores: ["Kitchen bathroom", "Scoop poop"] },
    { name: "Brooklyn", chores: ["Basement bathroom", "20 pairs of socks"] },
    { name: "Hazel", chores: ["Kids bathroom", "Garage"] },
    { name: "Maverick", chores: ["Garbages"] },
    { name: "Hinckley", chores: ["Van"] },
    { name: "Adaline", chores: ["Shoe basket", "Baseboards in all bathrooms"] },
    { name: "Raleigh", chores: ["Shoe basket"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", kid.name + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
