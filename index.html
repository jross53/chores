<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <style>
      :root {
          --page-bg: #eef3f9;
          --panel-bg: #ffffff;
          --panel-border: #d5e0ee;
          --text-strong: #18212b;
          --text-muted: #4a5f77;
          --accent: #1f5f95;
          --accent-soft: #edf4fc;
          --bullet-bg: #dbe9f8;
          --shadow: rgba(25, 55, 89, 0.12);
          --banner-bg: #eef4fc;
          --banner-border: #cadbed;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
          background: var(--page-bg);
          color: var(--text-strong);
          font-family: Arial, Helvetica, sans-serif;
      }

      body {
          padding: 16px 14px 22px;
          background:
              linear-gradient(180deg, #f5f9ff 0%, #eaf2fb 100%);
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          background: linear-gradient(180deg, #f8fbff 0%, #edf4fc 100%);
          border: 2px solid #cadbed;
          border-radius: 18px;
          padding: 20px 24px;
          box-shadow: 0 10px 26px rgba(25, 55, 89, 0.14);
          margin-bottom: 16px;
      }

      .page-title {
          margin: 0 0 8px;
          font-size: 2.5rem;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: 0;
      }

      .page-subtitle {
          margin: 0;
          font-size: 1.15rem;
          line-height: 1.35;
          color: var(--text-muted);
          font-weight: 600;
      }

      .chores-container {
          display: flex;
          flex-wrap: wrap;
          margin: 0 -6px;
      }

      .chore-card {
          width: calc(25% - 12px);
          margin: 0 6px 12px;
          background: linear-gradient(180deg, #ffffff 0%, #f4f8fe 100%);
          border: 2px solid #d8e4f2;
          border-radius: 18px;
          padding: 18px;
          box-shadow: 0 10px 24px rgba(25, 55, 89, 0.10);
      }

      .kid-profile {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 14px;
          min-width: 0;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          flex: 0 0 auto;
          border: 4px solid #ffffff;
          box-shadow: 0 6px 16px rgba(18, 31, 45, 0.18);
      }

      .kid-text {
          min-width: 0;
      }

      .kid-name {
          margin: 0 0 4px;
          font-size: 1.9rem;
          line-height: 1;
          font-weight: 700;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          margin-bottom: 9px;
          font-size: 1.08rem;
          line-height: 1.28;
          font-weight: 700;
          word-break: break-word;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          flex: 0 0 auto;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          background: var(--bullet-bg);
          color: var(--accent);
          font-size: 0.9rem;
          font-weight: 700;
      }

      .empty-state {
          background: var(--panel-bg);
          border: 1px solid var(--panel-border);
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 20px var(--shadow);
          font-size: 1rem;
          font-weight: 600;
          color: var(--text-muted);
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 10px 10px 14px;
          }

          .page-header {
              border-radius: 16px;
              padding: 16px 20px;
              margin-bottom: 12px;
          }

          .page-title {
              font-size: 2.35rem;
              margin-bottom: 6px;
          }

          .page-subtitle {
              font-size: 1rem;
          }

          .chores-container {
              margin: 0 -5px;
          }

          .chore-card {
              width: calc(25% - 10px);
              margin: 0 5px 10px;
              border-radius: 16px;
              padding: 16px;
          }

          .kid-profile {
              gap: 12px;
              margin-bottom: 12px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.8rem;
          }

          li {
              gap: 8px;
              margin-bottom: 8px;
              font-size: 1rem;
              line-height: 1.22;
          }

          .chore-bullet {
              width: 28px;
              height: 28px;
              font-size: 0.8rem;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: calc(50% - 12px);
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 16px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .page-subtitle {
              font-size: 0.92rem;
          }

          .chores-container {
              display: block;
              margin: 0;
          }

          .chore-card {
              width: auto;
              margin: 0 0 12px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.45rem;
          }

          li {
              font-size: 0.84rem;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title">Ross Family Chores</h1>
    <p class="page-subtitle">Family chore chart</p>
  </section>

  <div class="chores-container" id="choresContainer"></div>
</div>

  <script>
  var KIDS = [
    { name: "Ellie", chores: ["Softball"] },
    { name: "Brooklyn", chores: ["Kitchen bathroom", "Weed front flower bed"] },
    { name: "Hazel", chores: ["Garbages", "Scoop poop"] },
    { name: "Mav", avatarName: "Maverick", chores: ["Raspberry sticks", "Weeds on back patio"] },
    { name: "Hinckley", chores: ["Kids bathroom"] },
    { name: "Adaline", chores: ["Shoe basket", "Pantry"] },
    { name: "Raleigh", chores: ["Shoe basket"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
