<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #002868;
          background:
                  radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.85), transparent 30%),
                  radial-gradient(circle at 88% 12%, rgba(191, 10, 48, 0.55), transparent 34%),
                  radial-gradient(circle at 50% 85%, rgba(255, 255, 255, 0.5), transparent 28%),
                  linear-gradient(165deg, #123a7a 0%, #002868 45%, #001842 75%, #bf0a30 130%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(0, 40, 104, 0.35);
          background: rgba(0, 40, 104, 0.35);
          border: 2px solid rgba(255, 255, 255, 0.85);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(0, 10, 40, 0.35);
      }

      .birthday-note {
          margin: 6px 0 0;
          font-family: "Fredoka", sans-serif;
          font-size: 1.35rem;
          font-weight: 600;
          color: #ffffff;
          letter-spacing: 0.02em;
      }

      .season-badge {
          display: inline-block;
          border-radius: 999px;
          background-color: #bf0a30;
          background: linear-gradient(135deg, #d81e3f, #bf0a30);
          color: #fff8f0;
          border: 2px solid rgba(255, 255, 255, 0.95);
          box-shadow: 0 6px 16px rgba(0, 10, 40, 0.35);
          padding: 9px 18px;
          margin-bottom: 10px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          letter-spacing: 0.04em;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(0, 10, 40, 0.4);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 6px;
          font-size: 0.85em;
          vertical-align: baseline;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffef8;
          border: 4px solid #bf0a30;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(0, 10, 40, 0.28);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #002868;
          box-shadow: 0 6px 16px rgba(0, 10, 40, 0.25);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #002868;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffef4;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(0, 10, 40, 0.2);
          font-size: 1rem;
          font-weight: 600;
          color: #002868;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(0, 40, 104, 0.4);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(0, 10, 40, 0.2);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #002868;
      }

      .presidents-collage {
          text-align: center;
          margin-top: 14px;
      }

      .photo-feature {
          display: inline-block;
          vertical-align: middle;
          width: 138px;
          height: 166px;
          position: relative;
          overflow: hidden;
          border-radius: 16px;
          border: 2px solid #bf0a30;
          background: #fffef8;
          box-shadow: 0 10px 24px rgba(0, 10, 40, 0.28);
          margin: 5px;
      }

      .photo-feature img,
      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
      }

      .photo-feature img {
          object-position: center 14%;
      }

      .photo-feature-label {
          position: absolute;
          left: 8px;
          right: 8px;
          bottom: 8px;
          padding: 6px 8px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.92);
          color: #004d4d;
          font-size: 0.82rem;
          line-height: 1.2;
          font-weight: 700;
          text-align: center;
      }

      .photo-bubble {
          display: inline-block;
          vertical-align: middle;
          width: 138px;
          height: 166px;
          overflow: hidden;
          border-radius: 16px;
          border: 2px solid #bf0a30;
          background: #fffef8;
          box-shadow: 0 10px 24px rgba(0, 10, 40, 0.28);
          margin: 5px;
      }

      .president-photo img { object-position: center 15%; }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .photo-feature,
          .photo-bubble {
              width: 116px;
              height: 140px;
              border-radius: 14px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .photo-feature,
          .photo-bubble {
              width: 112px;
              height: 132px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .season-badge {
              padding: 8px 14px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .presidents-collage {
              margin-top: 8px;
          }

          .photo-feature,
          .photo-bubble {
              width: 110px;
              height: 128px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .photo-feature,
          .photo-bubble {
              width: 84px;
              height: 96px;
          }
      }
      #fireworksCanvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 999;
      }
  </style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true">🎆</span>Ross Family Chores<span class="title-icon" aria-hidden="true">🎆</span></h1>
    <p class="birthday-note">Happy 4th of July!</p>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->

  <section class="presidents-collage" aria-label="Photos of US presidents">
    <div class="photo-feature president-photo">
      <img src="president-washington.jpg" alt="George Washington">
    </div>
    <div class="photo-bubble president-photo"><img src="president-jefferson.jpg" alt="Thomas Jefferson"></div>
    <div class="photo-bubble president-photo"><img src="president-lincoln.jpg" alt="Abraham Lincoln"></div>
    <div class="photo-bubble president-photo"><img src="president-teddy.jpg" alt="Theodore Roosevelt"></div>
    <div class="photo-bubble president-photo"><img src="president-jfk.jpg" alt="John F. Kennedy"></div>
    <div class="photo-bubble president-photo"><img src="president-reagan.jpg" alt="Ronald Reagan"></div>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Room", "FSY stuff"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Garbages", "Weed flower bed by porch"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Kids bathroom", "Basement tub"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kitchen bathroom", "Kitchen floor"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Help Brooklyn"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Pantry", "Basement cabinets and walls"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();

  // --- Firework effect ---
  // TESTING: fires every 10 seconds. For production, change FIREWORK_INTERVAL_MS to 60000.
  var FIREWORK_INTERVAL_MS = 30000;
  var FIREWORK_COLORS = ["#ff4d4d", "#ffffff", "#4d7dff", "#ffd24d", "#5fd490"];

  var canvas = document.getElementById("fireworksCanvas");
  var ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
  var particles = [];
  var animating = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function launchBurst(originX, originY, color) {
    var particleCount = 90;

    for (var i = 0; i < particleCount; i++) {
      var angle = (Math.PI * 2 * i) / particleCount;
      var speed = 3 + Math.random() * 4;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: color,
        size: 2.5 + Math.random() * 1.5,
        life: 90
      });
    }
  }

  function launchFirework() {
    if (!ctx) return;

    var burstCount = 10 + Math.floor(Math.random() * 4);
    for (var b = 0; b < burstCount; b++) {
      var originX = canvas.width * (0.15 + Math.random() * 0.7);
      var originY = canvas.height * (0.15 + Math.random() * 0.4);
      var color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
      launchBurst(originX, originY, color);
    }

    if (!animating) {
      animating = true;
      animateParticles();
    }
  }

  function animateParticles() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "source-over";

    var stillAlive = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.life -= 1;

      if (p.life > 0) {
        ctx.globalAlpha = Math.max(p.life / 90, 0);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        stillAlive.push(p);
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    particles = stillAlive;

    if (particles.length > 0) {
      if (window.requestAnimationFrame) {
        requestAnimationFrame(animateParticles);
      } else {
        setTimeout(animateParticles, 33);
      }
    } else {
      animating = false;
    }
  }

  // Some old TV browsers fire long-delay setInterval calls unreliably (too often/too fast).
  // Checking elapsed wall-clock time on a short, frequent tick is more robust.
  var lastLaunchTime = 0;

  function checkFireworkSchedule() {
    var now = new Date().getTime();
    if (now - lastLaunchTime >= FIREWORK_INTERVAL_MS) {
      lastLaunchTime = now;
      launchFirework();
    }
  }

  if (ctx) {
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    lastLaunchTime = new Date().getTime();
    setInterval(checkFireworkSchedule, 1000);
    launchFirework();
  }
</script>
</body>
</html>
