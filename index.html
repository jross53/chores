<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background:
                  radial-gradient(circle at 10% 8%, rgba(255, 223, 103, 0.42), transparent 34%),
                  radial-gradient(circle at 92% 12%, rgba(245, 57, 61, 0.35), transparent 30%),
                  linear-gradient(155deg, #0d5ea8 0%, #1f7fcd 35%, #2ab0a4 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background: rgba(0, 28, 68, 0.42);
          border: 2px solid rgba(255, 255, 255, 0.35);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(0, 18, 38, 0.3);
      }

      .logo-wrap {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border-radius: 10px;
          background: white;
          padding: 10px 14px;
          box-shadow: 0 6px 16px rgba(0,0,0,0.2);
          margin-bottom: 10px;
      }

      .park-logo {
          display: block;
          max-width: min(360px, 70vw);
          width: 100%;
          height: auto;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffef99;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(0,0,0,0.2);
          letter-spacing: 0;
      }

      .page-subtitle {
          font-family: "Inter", sans-serif;
          font-size: 1.02rem;
          font-weight: 600;
          color: rgba(255,255,255,0.95);
          margin: 0;
          text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      }

      .chores-container {
          display: flex;
          flex-wrap: wrap;
          margin: 0 -6px;
      }

      .chore-card {
          width: calc(25% - 12px);
          margin: 0 6px 12px;
          background:
                  linear-gradient(#fffef6, #fffef6) padding-box,
                  repeating-linear-gradient(-45deg, #ef4f4f 0 10px, #ffffff 10px 20px) border-box;
          border: 3px solid transparent;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      }

      .kid-profile {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 14px;
          min-width: 0;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          flex: 0 0 auto;
          border: 4px solid #ffe16b;
          box-shadow: 0 6px 16px rgba(18, 31, 45, 0.24);
      }

      .kid-text {
          min-width: 0;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #1a2e3b;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          flex: 0 0 auto;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .empty-state {
          background: #fff;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(0,0,0,0.12);
          font-size: 1rem;
          font-weight: 600;
          color: #555;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0 -5px;
          }

          .chore-card {
              width: calc(25% - 10px);
              margin: 0 5px 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              gap: 8px;
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: calc(50% - 12px);
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .logo-wrap {
              padding: 8px 10px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              display: block;
              margin: 0;
          }

          .chore-card {
              width: auto;
              margin: 0 0 12px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <div class="logo-wrap">
      <img src="lagoon-logo.png" alt="Lagoon logo" class="park-logo">
    </div>
    <h1 class="page-title">Ross Family Chores</h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
</div>

  <script>
  var KIDS = [
    { name: "Ellie", color: "#ff6f91", chores: ["Kids bathroom", "Stainless steel"] },
    { name: "Brooklyn", color: "#ff9671", chores: ["Basement bathroom + tub and floor"] },
    { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Garbages", "Computer area"] },
    { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kitchen bathroom", "Piano room books"] },
    { name: "Hinckley", color: "#5fd490", chores: ["Garage", "Van"] },
    { name: "Adaline", color: "#6ec6ff", chores: ["Shoe basket", "Pantry"] },
    { name: "Raleigh", color: "#b57bee", chores: ["Shoe basket"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
