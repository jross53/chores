<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #123a7a;
          background:
                  radial-gradient(circle at 14% 12%, rgba(255, 255, 255, 0.7), transparent 32%),
                  radial-gradient(circle at 88% 86%, rgba(178, 34, 52, 0.55), transparent 38%),
                  linear-gradient(165deg, #dfe8ff 0%, #8ea9e2 26%, #1b4a9c 60%, #04163d 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(4, 26, 69, 0.55);
          background: rgba(4, 26, 69, 0.55);
          border: 2px solid rgba(255, 255, 255, 0.9);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(4, 20, 50, 0.32);
      }

      .season-badge {
          display: inline-block;
          border-radius: 999px;
          background-color: #b22234;
          background: linear-gradient(135deg, #d0384a, #8d1a28);
          color: #fffef8;
          border: 2px solid rgba(255, 255, 255, 0.95);
          box-shadow: 0 6px 16px rgba(4, 20, 50, 0.4);
          padding: 9px 18px;
          margin-bottom: 10px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          letter-spacing: 0.04em;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(4, 20, 50, 0.45);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 6px;
          font-size: 0.85em;
          vertical-align: baseline;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffef8;
          border: 4px solid #b22234;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.32);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #002868;
          box-shadow: 0 6px 16px rgba(4, 20, 50, 0.3);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #0a2351;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffef4;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.25);
          font-size: 1rem;
          font-weight: 600;
          color: #0a2351;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(0, 40, 104, 0.4);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.25);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #0a2351;
      }

      .flag-banner {
          text-align: center;
          margin-top: 14px;
      }

      .flag {
          position: relative;
          display: inline-block;
          width: 480px;
          height: 253px;
          font-size: 12px;
          overflow: hidden;
          border: 3px solid #fffef8;
          border-radius: 6px;
          background-color: #fffef8;
          box-shadow: 0 10px 24px rgba(4, 20, 50, 0.45);
      }

      .flag-stripe {
          height: 7.6923%;
      }

      .flag-stripe-red {
          background-color: #b22234;
      }

      .flag-canton {
          position: absolute;
          top: 0;
          left: 0;
          width: 40%;
          height: 53.846%;
          overflow: hidden;
          background-color: #002868;
          padding-top: 0.3em;
      }

      .flag-star-row {
          height: 1.16em;
          line-height: 1.16em;
          color: #fffef8;
          letter-spacing: 1.667em;
          padding-left: 0.833em;
      }

      .flag-star-row-short {
          padding-left: 2.167em;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .flag {
              width: 380px;
              height: 200px;
              font-size: 9.5px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .flag {
              width: 760px;
              height: 400px;
              font-size: 19px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .flag {
              width: 420px;
              height: 221px;
              font-size: 10.5px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .season-badge {
              padding: 8px 14px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .flag-banner {
              margin-top: 8px;
          }

          .flag {
              width: 300px;
              height: 158px;
              font-size: 7.5px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .flag {
              width: 320px;
              height: 168px;
              font-size: 8px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true">★</span>Ross Family Chores<span class="title-icon" aria-hidden="true">★</span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="flag-banner" aria-label="American flag">
    <div class="flag">
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-stripe"></div>
      <div class="flag-stripe flag-stripe-red"></div>
      <div class="flag-canton">
      <div class="flag-star-row">★★★★★★</div>
      <div class="flag-star-row flag-star-row-short">★★★★★</div>
      <div class="flag-star-row">★★★★★★</div>
      <div class="flag-star-row flag-star-row-short">★★★★★</div>
      <div class="flag-star-row">★★★★★★</div>
      <div class="flag-star-row flag-star-row-short">★★★★★</div>
      <div class="flag-star-row">★★★★★★</div>
      <div class="flag-star-row flag-star-row-short">★★★★★</div>
      <div class="flag-star-row">★★★★★★</div>
      </div>
    </div>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Garbages", "Garage"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Basement bathroom (including tub)", "Dress up room"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Stainless steel", "Sort 1 load of laundry"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kids bathroom", "Kitchen chairs"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Kitchen bathroom", "Backpack", "Van"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Pantry", "Backpack", "Dress up room"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket", "Kitchen chairs"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
