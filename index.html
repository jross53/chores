<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
      :root {
          --sky-top: #f5c98e;
          --sky-mid: #f6e1ba;
          --sky-bottom: #f7f2df;
          --horizon: #f3dbc7;
          --garden-deep: #58704c;
          --garden-mid: #7d9367;
          --garden-light: #abc48b;
          --lily: #fff8ef;
          --lily-shadow: #eadcc7;
          --gold: #d7a447;
          --rose: #d98f93;
          --ink: #463425;
          --glow: rgba(255, 250, 238, 0.8);
      }

      body {
          font-family: "Nunito", sans-serif;
          background: #efe5d4;
          background:
              linear-gradient(180deg, rgba(255, 250, 242, 0.38), rgba(239, 229, 212, 0.44)),
              url("resurrection-background.png") center center / cover no-repeat fixed;
          padding: 18px 12px 28px;
          margin: 0;
          min-height: 100vh;
          position: relative;
          overflow-x: hidden;
          color: var(--ink);
      }

      body::before,
      body::after {
          content: "";
          position: fixed;
          left: 0;
          width: 100%;
          pointer-events: none;
      }

      body::before {
          inset: 0;
          background: linear-gradient(180deg, rgba(92, 74, 53, 0.03), rgba(255,255,255,0.02) 22%, rgba(255,248,240,0.12) 100%);
          z-index: 0;
      }

      body::after {
          top: 0;
          height: 28vh;
          background:
              linear-gradient(180deg, rgba(255,255,255,0.2), transparent 78%);
          z-index: 0;
      }

      h1 {
          font-family: "Cormorant Garamond", serif;
          font-size: 3.4rem;
          text-align: center;
          color: #4f3824;
          margin: 0;
          letter-spacing: 0.03em;
          text-shadow:
              0 2px 0 rgba(255, 249, 238, 0.85),
              0 8px 24px rgba(79, 56, 36, 0.35);
          display: inline-block;
          padding: 10px 24px 12px;
          border-radius: 18px;
          background: rgba(255, 248, 236, 0.72);
          box-shadow: 0 10px 28px rgba(79, 56, 36, 0.18);
          backdrop-filter: blur(4px);
      }

      .hero {
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 1120px;
          margin: 0 auto 26px;
          padding: 28px 18px 12px;
      }

      .hero-panel {
          padding: 28px 20px 24px;
          border-radius: 30px;
          background:
              linear-gradient(180deg, rgba(255,255,255,0.52), rgba(255,250,242,0.28));
          border: 1px solid rgba(255, 249, 236, 0.62);
          box-shadow: 0 18px 48px rgba(123, 92, 54, 0.1);
          backdrop-filter: blur(2px);
      }

      .hero-subtitle {
          color: rgba(91, 63, 34, 0.85);
          font-size: 0.88rem;
          font-weight: 700;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          margin-top: 0;
      }

      .hero-message {
          max-width: 720px;
          margin: 14px auto 0;
          font-size: 1.08rem;
          line-height: 1.5;
          color: #5f4630;
          font-weight: 700;
      }

      .hero-scripture {
          margin-top: 12px;
          font-family: "Cormorant Garamond", serif;
          font-size: 1.5rem;
          color: #715239;
          text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      }

      .floating-symbol {
          position: fixed;
          top: -10px;
          color: var(--glow);
          font-size: 1rem;
          pointer-events: none;
          -webkit-animation: drift linear infinite;
          animation: drift linear infinite;
          opacity: 0.45;
          z-index: 2;
          text-shadow: 0 3px 12px rgba(255,255,255,0.38);
      }

      @-webkit-keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          20% { opacity: 0.82; }
          100% {
              -webkit-transform: translateY(100vh) translateX(28px) rotate(16deg);
              transform: translateY(100vh) translateX(28px) rotate(16deg);
              opacity: 0.1;
          }
      }

      @keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          20% { opacity: 0.82; }
          100% {
              -webkit-transform: translateY(100vh) translateX(28px) rotate(16deg);
              transform: translateY(100vh) translateX(28px) rotate(16deg);
              opacity: 0.1;
          }
      }

      .chores-container {
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 1600px;
          margin: 0 auto;
          padding: 0 10px;
          overflow: hidden;
      }

      .chore-card {
          background:
              linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.18)),
              linear-gradient(145deg, var(--lily), #f8eedf);
          border-radius: 22px;
          -webkit-border-radius: 22px;
          padding: 16px 16px 18px;
          box-shadow: 0 14px 30px rgba(127, 93, 57, 0.14);
          -webkit-box-shadow: 0 14px 30px rgba(127, 93, 57, 0.14);
          border: 1px solid rgba(192, 157, 110, 0.32);
          -webkit-transition: all 0.25s ease;
          transition: all 0.25s ease;
          width: 300px;
          margin: 8px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          position: relative;
      }

      .chore-card::before {
          content: "";
          position: absolute;
          left: 14px;
          right: 14px;
          top: 10px;
          height: 10px;
          border-radius: 999px;
          background: linear-gradient(90deg, rgba(217, 164, 71, 0.32), rgba(255,255,255,0.95), rgba(217, 164, 71, 0.32));
          opacity: 0.95;
      }

      .chore-card:hover {
          -webkit-transform: translateY(-4px);
          transform: translateY(-4px);
          box-shadow: 0 20px 40px rgba(127, 93, 57, 0.26);
          -webkit-box-shadow: 0 20px 40px rgba(127, 93, 57, 0.26);
          border-color: rgba(172, 124, 69, 0.52);
      }

      .dance-card {
          -webkit-animation: hazel-dance 1.4s ease-in-out 1;
          animation: hazel-dance 1.4s ease-in-out 1;
          -webkit-transform-origin: center bottom;
          transform-origin: center bottom;
      }

      @-webkit-keyframes hazel-dance {
          0%, 100% { -webkit-transform: translateX(0) rotate(0deg); transform: translateX(0) rotate(0deg); }
          10% { -webkit-transform: translateX(-4px) rotate(-2deg); transform: translateX(-4px) rotate(-2deg); }
          20% { -webkit-transform: translateX(4px) rotate(2deg) translateY(-3px); transform: translateX(4px) rotate(2deg) translateY(-3px); }
          35% { -webkit-transform: translateX(-6px) rotate(-3deg); transform: translateX(-6px) rotate(-3deg); }
          50% { -webkit-transform: translateX(6px) rotate(3deg) translateY(-5px); transform: translateX(6px) rotate(3deg) translateY(-5px); }
          65% { -webkit-transform: translateX(-3px) rotate(-1deg); transform: translateX(-3px) rotate(-1deg); }
          80% { -webkit-transform: translateX(3px) rotate(1deg) translateY(-2px); transform: translateX(3px) rotate(1deg) translateY(-2px); }
      }

      @keyframes hazel-dance {
          0%, 100% { -webkit-transform: translateX(0) rotate(0deg); transform: translateX(0) rotate(0deg); }
          10% { -webkit-transform: translateX(-4px) rotate(-2deg); transform: translateX(-4px) rotate(-2deg); }
          20% { -webkit-transform: translateX(4px) rotate(2deg) translateY(-3px); transform: translateX(4px) rotate(2deg) translateY(-3px); }
          35% { -webkit-transform: translateX(-6px) rotate(-3deg); transform: translateX(-6px) rotate(-3deg); }
          50% { -webkit-transform: translateX(6px) rotate(3deg) translateY(-5px); transform: translateX(6px) rotate(3deg) translateY(-5px); }
          65% { -webkit-transform: translateX(-3px) rotate(-1deg); transform: translateX(-3px) rotate(-1deg); }
          80% { -webkit-transform: translateX(3px) rotate(1deg) translateY(-2px); transform: translateX(3px) rotate(1deg) translateY(-2px); }
      }

      .kid-profile {
          margin-bottom: 14px;
          overflow: hidden;
          padding-top: 12px;
      }

      .kid-avatar {
          width: 80px;
          height: 80px;
          border-radius: 50%;
          -webkit-border-radius: 50%;
          object-fit: cover;
          border: 4px solid #fff5e7;
          box-shadow: 0 8px 18px rgba(136, 98, 56, 0.2);
          -webkit-box-shadow: 0 8px 18px rgba(136, 98, 56, 0.2);
          float: left;
          margin-right: 16px;
      }

      .kid-name {
          font-family: "Cormorant Garamond", serif;
          font-size: 1.7rem;
          font-weight: 400;
          padding: 8px 16px;
          border-radius: 14px;
          -webkit-border-radius: 14px;
          color: #fffef9;
          display: inline-block;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 5px 12px rgba(120,82,45,0.18);
          -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 5px 12px rgba(120,82,45,0.18);
          margin-top: 18px;
          letter-spacing: 0.02em;
      }

      .Ellie { background: linear-gradient(135deg, #d99d78, #c57f6c); }
      .Brooklyn { background: linear-gradient(135deg, #c7856f, #ab6f74); }
      .Hazel { background: linear-gradient(135deg, #d4ae73, #bd9657); }
      .Maverick { background: linear-gradient(135deg, #8aa36b, #6e8756); }
      .Hinckley { background: linear-gradient(135deg, #6d8e72, #54775d); }
      .Adaline { background: linear-gradient(135deg, #8da8a6, #6d8b98); }
      .Raleigh { background: linear-gradient(135deg, #b58d6e, #9e7357); }

      ul {
          margin: 0;
          padding-left: 20px;
      }

      li {
          margin-bottom: 7px;
          font-size: 1.06rem;
          line-height: 1.35;
      }

      .chore-list-title {
          font-family: "Nunito", sans-serif;
          font-size: 0.86rem;
          color: #8d6b45;
          margin-bottom: 10px;
          text-transform: uppercase;
          letter-spacing: 0.18em;
          font-weight: 800;
      }

      .quote-section {
          position: relative;
          z-index: 1;
          text-align: center;
          margin: 18px auto 0;
          padding: 18px 20px 14px;
          max-width: 960px;
          background: rgba(255, 250, 241, 0.3);
          border: 1px solid rgba(212, 180, 135, 0.32);
          border-radius: 22px;
          -webkit-border-radius: 22px;
          backdrop-filter: blur(8px);
          box-shadow: 0 14px 34px rgba(140, 101, 58, 0.1);
      }

      .quote {
          font-family: "Cormorant Garamond", serif;
          font-size: 1.9rem;
          color: #68452b;
          text-shadow: 0 2px 10px rgba(255,255,255,0.35);
          margin-bottom: 6px;
      }

      .quote-emphasis {
          font-style: normal;
          font-weight: 700;
          color: #ffd58b;
          text-decoration: underline;
          text-decoration-color: rgba(255, 213, 139, 0.45);
          text-shadow: 0 2px 4px rgba(0,0,0,0.35);
      }

      .quote-author {
          font-family: "Nunito", sans-serif;
          font-size: 0.95rem;
          color: rgba(95, 66, 38, 0.82);
          font-weight: 700;
          text-shadow: none;
      }

      @media (max-width: 720px) {
          h1 {
              font-size: 2.7rem;
          }

          .hero-subtitle {
              font-size: 0.82rem;
              letter-spacing: 0.16em;
          }

          .hero-message {
              font-size: 0.98rem;
          }

          .hero-scripture {
              font-size: 1.28rem;
          }

          .chore-card {
              width: auto;
              display: block;
              margin: 10px auto;
              max-width: 340px;
          }

      }
  </style>
</head>
<body>

<div class="hero">
  <h1>Ross Family Chores</h1>
</div>

<div class="chores-container" id="choresContainer">
  <!-- Cards will be generated by JavaScript -->
</div>

<div class="quote-section">
  <div class="quote">"Why seek ye the living among the dead? He is not here, but is risen."</div>
</div>

<script>
  var DANCE_DURATION_MS = 1400;
  var DANCE_PAUSE_MS = 3000;
  var danceTimerId = null;

  var KIDS = [
    { name: "Ellie", chores: ["Scoop poop"] },
    { name: "Brooklyn", chores: ["Garbages", "Vacuum basement"] },
    { name: "Hazel", chores: ["Kids bathroom", "Basement bathroom"] },
    { name: "Maverick", chores: ["Kitchen bathroom", "Van"] },
    { name: "Hinckley", chores: ["Garage", "Vacuum laundry room and landing"] },
    { name: "Adaline", chores: ["Shoe basket", "Pantry", "Backpack"] },
    { name: "Raleigh", chores: ["Shoe basket", "Room"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    // Clear existing cards safely
    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];

      // Create card
      var card = document.createElement("div");
      card.setAttribute("class", "chore-card");

      // Create profile section
      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      // Create avatar image
      var avatar = document.createElement("img");
      avatar.setAttribute("src", kid.name + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      // Create name badge
      var nameDiv = document.createElement("div");
      nameDiv.setAttribute("class", "kid-name " + kid.name);
      nameDiv.textContent = kid.name;

      profileDiv.appendChild(avatar);
      profileDiv.appendChild(nameDiv);

      // Create chores section
      var choresDiv = document.createElement("div");
      var choreTitle = document.createElement("div");
      choreTitle.setAttribute("class", "chore-list-title");
      choreTitle.textContent = "Chores";
      choresDiv.appendChild(choreTitle);

      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");
        li.textContent = kid.chores[j];
        ul.appendChild(li);
      }
      choresDiv.appendChild(ul);

      // Assemble card
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  function startDanceRotation() {
    var cards = document.querySelectorAll(".chore-card");
    var danceIndex = 0;

    if (danceTimerId) {
      clearTimeout(danceTimerId);
      danceTimerId = null;
    }

    if (!cards.length) return;

    function queueNextDance() {
      var activeCard = cards[danceIndex];
      activeCard.classList.add("dance-card");

      danceTimerId = setTimeout(function() {
        activeCard.classList.remove("dance-card");
        danceIndex = (danceIndex + 1) % cards.length;
        danceTimerId = setTimeout(queueNextDance, DANCE_PAUSE_MS);
      }, DANCE_DURATION_MS);
    }

    queueNextDance();
  }

  renderTable();
  startDanceRotation();

  // Create gentle drifting spring symbols for a light Easter feel.
  try {
    var MAX_SYMBOLS = 18;
    var symbolCount = 0;
    var symbols = ['✦', '✿', '·', '❀'];

    function createSymbol() {
      try {
        if (symbolCount >= MAX_SYMBOLS) {
          return;
        }
        if (typeof document.hidden !== 'undefined' && document.hidden) {
          return;
        }

        var symbol = document.createElement('div');
        symbol.setAttribute('class', 'floating-symbol');
        symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        symbol.style.left = Math.random() * 100 + 'vw';
        var duration = Math.random() * 4 + 6;
        symbol.style.animationDuration = duration + 's';
        symbol.style.fontSize = (Math.random() * 0.55 + 0.85) + 'rem';
        document.body.appendChild(symbol);
        symbolCount++;

        setTimeout(function() {
          if (symbol.parentNode) {
            symbol.parentNode.removeChild(symbol);
            symbolCount--;
          }
        }, (duration + 0.5) * 1000);
      } catch (e) {
        // Silently fail - animation is non-essential
      }
    }

    setInterval(createSymbol, 700);
  } catch (e) {
    // Animation not supported - table will still work
  }

</script>

</body>
</html>
