<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #f7a844;
          background:
                  radial-gradient(circle at 12% 10%, rgba(255, 241, 152, 0.95), transparent 35%),
                  radial-gradient(circle at 88% 12%, rgba(255, 169, 77, 0.45), transparent 34%),
                  linear-gradient(165deg, #6fd7ff 0%, #8ee8ff 28%, #ffd166 62%, #ff9f45 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background: rgba(255, 132, 61, 0.26);
          border: 2px solid rgba(255, 250, 227, 0.82);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(119, 53, 0, 0.22);
      }

      .season-badge {
          display: inline-block;
          border-radius: 999px;
          background: linear-gradient(135deg, #ffe58a, #ffc44d);
          color: #8a3d00;
          border: 2px solid rgba(255, 250, 227, 0.95);
          box-shadow: 0 6px 16px rgba(133, 57, 0, 0.25);
          padding: 9px 18px;
          margin-bottom: 10px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          letter-spacing: 0.04em;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #fff8e1;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(99, 44, 0, 0.25);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 6px;
          font-size: 0.85em;
          vertical-align: baseline;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffef8;
          background:
                  linear-gradient(#fffef8, #fffef8) padding-box,
                  repeating-linear-gradient(-45deg, #ffb347 0 10px, #fff4de 10px 20px) border-box;
          border: 3px solid transparent;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(138, 65, 0, 0.22);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #ffd36e;
          box-shadow: 0 6px 16px rgba(102, 50, 0, 0.2);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      .name-icon {
          font-size: 0.9em;
          margin-left: 8px;
          vertical-align: baseline;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #5a3200;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffef4;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(133, 63, 0, 0.16);
          font-size: 1rem;
          font-weight: 600;
          color: #8a4a00;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 248, 225, 0.92);
          border: 2px solid rgba(255, 250, 227, 0.95);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(133, 63, 0, 0.16);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #8a3d00;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .season-badge {
              padding: 8px 14px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true">🌴</span>Ross Family Chores<span class="title-icon" aria-hidden="true">🍉</span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", rideIcon: "🍓", chores: ["Garbages"] },
     { name: "Brooklyn", color: "#ff9671", rideIcon: "🌺", chores: ["Kids bathroom"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", rideIcon: "🌻", chores: ["Kitchen bathroom walls"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", rideIcon: "⛱️", chores: ["Baseboards on all stairs"] },
     { name: "Hinckley", color: "#5fd490", rideIcon: "🌞", chores: ["Kitchen bathroom"] },
     { name: "Adaline", color: "#6ec6ff", rideIcon: "🦋", chores: ["Pantry", "Basement cabinets"] },
     { name: "Raleigh", color: "#b97fdb", rideIcon: "🌈", chores: ["Shoe basket"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;
      if (kid.rideIcon) {
        var nameIcon = document.createElement("span");
        nameIcon.setAttribute("class", "name-icon");
        nameIcon.setAttribute("aria-hidden", "true");
        nameIcon.textContent = kid.rideIcon;
        nameDiv.appendChild(nameIcon);
      }

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
