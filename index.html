<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #5a2a14;
          background:
                  radial-gradient(circle at 50% 100%, rgba(255, 170, 60, 0.4), transparent 55%),
                  linear-gradient(180deg, #3b1d10 0%, #6b2f14 50%, #a2471a 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: #c4520a;
          background: linear-gradient(90deg, rgba(214, 102, 26, 0.92), rgba(140, 40, 20, 0.92));
          border: 2px solid #ffb347;
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(20, 5, 30, 0.6);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 12px;
          vertical-align: middle;
          font-size: 0.6em;
      }

      .pumpkin {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 1.7em;
          height: 1.4em;
          background-color: #ff8a1f;
          background: radial-gradient(circle at 35% 30%, #ffc266 0%, #ff8a1f 55%, #c4520a 100%);
          border-radius: 50%;
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      }

      .pumpkin:before {
          content: "";
          position: absolute;
          left: 50%;
          top: -0.25em;
          width: 0.2em;
          height: 0.35em;
          margin-left: -0.1em;
          background-color: #4f7a28;
          border-radius: 0.05em;
      }

      .pumpkin:after {
          content: "";
          position: absolute;
          left: 30%;
          top: 0;
          width: 40%;
          height: 100%;
          border-left: 0.06em solid rgba(160, 60, 0, 0.45);
          border-right: 0.06em solid rgba(160, 60, 0, 0.45);
          border-radius: 50%;
          box-sizing: border-box;
      }

      .leaf {
          display: inline-block;
          vertical-align: middle;
          width: 1.3em;
          height: 1.3em;
          background-color: #d9481c;
          background: linear-gradient(135deg, #f2a33a 0%, #d9481c 60%, #8f2a10 100%);
          border-radius: 0 1.3em 0 1.3em;
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fff8ef;
          border: 4px solid #ff8a1f;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #8f2a10;
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #2e1838;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fff8ef;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
          font-size: 1rem;
          font-weight: 600;
          color: #2e1838;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 248, 239, 0.94);
          border: 2px solid rgba(232, 102, 26, 0.6);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #2e1838;
      }

      .photo-collage {
          text-align: center;
          margin-top: 14px;
      }

      .photo-bubble {
          display: inline-block;
          vertical-align: middle;
          width: 300px;
          height: 230px;
          overflow: hidden;
          border-radius: 16px;
          border: 3px solid #ff8a1f;
          background: #3a2350;
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
          margin: 5px 8px;
      }

      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 30%;
      }

      .gratitude-quote {
          text-align: center;
          margin-top: 16px;
          font-family: "Fredoka", sans-serif;
          font-size: 26px;
          font-weight: 600;
          line-height: 1.2;
          color: #fff4dc;
          text-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
      }

      .quote-author {
          font-weight: 400;
          color: #ffd28a;
          margin-left: 0.4em;
      }


      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .gratitude-quote {
              font-size: 20px;
          }

          .photo-bubble {
              width: 200px;
              height: 150px;
              border-radius: 14px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .gratitude-quote {
              font-size: 30px;
          }

          .photo-bubble {
              width: 380px;
              height: 285px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .gratitude-quote {
              font-size: 22px;
          }

          .photo-bubble {
              width: 230px;
              height: 175px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .gratitude-quote {
              margin-top: 10px;
              font-size: 15px;
          }

          .photo-collage {
              margin-top: 8px;
          }

          .photo-bubble {
              width: 260px;
              height: 195px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .gratitude-quote {
              font-size: 16px;
          }

          .photo-bubble {
              width: 160px;
              height: 120px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon pumpkin" aria-hidden="true"></span>Ross Family Chores<span class="title-icon leaf" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <p class="gratitude-quote">&ldquo;Happiness is not having what you want. It is wanting what you have.&rdquo;<span class="quote-author">&mdash; Hyman Schachtel</span></p>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Basement bathroom (including baseboards and tub)", "Garage (by bikes, in between cars, and wall by the Tesla)"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Kitchen bathroom (including the white shelf)", "2 living room window sills"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Garbages", "Milk spills (ask Mom or Dad)"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kids bathroom"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Match 10 socks", "Vacuum main floor"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Pantry", "Barbie house and barbie bin"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket", "Wash kitchen chairs"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
