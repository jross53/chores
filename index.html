<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #f3a6c8;
          background:
                  radial-gradient(circle at 8% 14%, rgba(255, 255, 255, 0.75), transparent 4%),
                  radial-gradient(circle at 92% 22%, rgba(255, 255, 255, 0.65), transparent 3%),
                  radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.55), transparent 3%),
                  radial-gradient(circle at 18% 82%, rgba(255, 236, 160, 0.6), transparent 5%),
                  radial-gradient(circle at 50% 0%, rgba(255, 240, 248, 0.7), transparent 45%),
                  linear-gradient(180deg, #ffc9df 0%, #f7a1c6 35%, #e2a3e6 70%, #b99af0 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: #d63384;
          background: linear-gradient(90deg, rgba(214, 51, 132, 0.88), rgba(155, 72, 205, 0.88));
          border: 2px solid #ffe08a;
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(120, 30, 90, 0.32);
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(90, 20, 70, 0.45);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 12px;
          vertical-align: middle;
      }

      .tennis-ball {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          overflow: hidden;
          width: 1.5em;
          height: 1.5em;
          background-color: #d7f04a;
          background: radial-gradient(circle at 35% 30%, #f4ff94 0%, #d7f04a 55%, #a7c01d 100%);
          border-radius: 50%;
          box-shadow: 0 6px 14px rgba(120, 30, 90, 0.35);
      }

      .tennis-ball:before,
      .tennis-ball:after {
          content: "";
          position: absolute;
          top: 6%;
          width: 88%;
          height: 88%;
          border: 0.09em solid #ffffff;
          border-radius: 50%;
      }

      .tennis-ball:before {
          left: -58%;
      }

      .tennis-ball:after {
          right: -58%;
      }

      .mic {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 0.9em;
          height: 2em;
      }

      .mic:before {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          width: 0.9em;
          height: 0.9em;
          background-color: #d9d4e6;
          background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d9d4e6 50%, #9a8fb5 100%);
          border-radius: 50%;
          box-shadow: 0 4px 10px rgba(120, 30, 90, 0.35);
      }

      .mic:after {
          content: "";
          position: absolute;
          left: 50%;
          top: 0.8em;
          width: 0.34em;
          height: 1.2em;
          margin-left: -0.17em;
          background-color: #d63384;
          border-radius: 0.06em 0.06em 0.17em 0.17em;
      }

      .title-icon.mic {
          font-size: 0.6em;
      }

      .title-icon.tennis-ball {
          font-size: 0.6em;
      }

      .note {
          color: #8e3fc4;
          font-weight: 700;
          text-shadow: 0 2px 4px rgba(255, 255, 255, 0.6);
      }

      .heart {
          color: #e6227a;
          text-shadow: 0 2px 4px rgba(255, 255, 255, 0.6);
      }

      .star {
          color: #ffcf33;
          text-shadow: 0 2px 4px rgba(150, 60, 120, 0.4);
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffafd;
          border: 4px solid #ff7eb6;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(120, 30, 90, 0.28);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #b04fd6;
          box-shadow: 0 6px 16px rgba(120, 30, 90, 0.3);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #4a1d3a;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffafd;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(120, 30, 90, 0.25);
          font-size: 1rem;
          font-weight: 600;
          color: #4a1d3a;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(214, 51, 132, 0.45);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(120, 30, 90, 0.25);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #4a1d3a;
      }

      .birthday-collage {
          text-align: center;
          margin-top: 14px;
      }

      .photo-bubble {
          display: inline-block;
          vertical-align: middle;
          width: 220px;
          height: 260px;
          overflow: hidden;
          border-radius: 16px;
          border: 3px solid #ffffff;
          background: #fde3ef;
          box-shadow: 0 10px 24px rgba(120, 30, 90, 0.3);
          margin: 5px;
      }

      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 15%;
      }

      .party-garland {
          text-align: center;
          margin-top: 16px;
          font-size: 26px;
          line-height: 1;
      }

      .party-garland span {
          margin-left: 0.35em;
          margin-right: 0.35em;
          vertical-align: middle;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .party-garland {
              font-size: 20px;
          }

          .photo-bubble {
              width: 130px;
              height: 160px;
              border-radius: 14px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .party-garland {
              font-size: 34px;
          }

          .photo-bubble {
              width: 190px;
              height: 235px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .party-garland {
              font-size: 22px;
          }

          .photo-bubble {
              width: 170px;
              height: 200px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .party-garland {
              margin-top: 10px;
              font-size: 15px;
          }

          .birthday-collage {
              margin-top: 8px;
          }

          .photo-bubble {
              width: 150px;
              height: 175px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .party-garland {
              font-size: 16px;
          }

          .photo-bubble {
              width: 110px;
              height: 135px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon mic" aria-hidden="true"></span>Ross Family Chores<span class="title-icon tennis-ball" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="birthday-collage" aria-label="Birthday photos for Brooklyn">
    <div class="photo-bubble"><img src="brooklyn-bday-1.jpg" alt="Brooklyn with kitty face paint"></div>
    <div class="photo-bubble"><img src="brooklyn-bday-2.jpg" alt="Brooklyn making a silly face"></div>
    <div class="photo-bubble"><img src="brooklyn-bday-3.jpg" alt="Brooklyn showing her teeth"></div>
    <div class="photo-bubble"><img src="brooklyn-bday-4.jpg" alt="Brooklyn at the beach with a lei"></div>
    <div class="photo-bubble"><img src="brooklyn-bday-5.jpg" alt="Brooklyn smiling in the kitchen"></div>
    <div class="photo-bubble"><img src="brooklyn-bday-6.jpg" alt="Brooklyn in glasses being silly"></div>
  </section>
  <section class="party-garland" aria-label="Tennis balls, microphones, music notes and theater masks">
    <span class="heart">&#9829;</span>
    <span class="tennis-ball"></span>
    <span class="note">&#9834;</span>
    <span class="mic"></span>
    <span class="star">&#9733;</span>
    <span aria-hidden="true">🎭</span>
    <span class="heart">&#9829;</span>
    <span class="tennis-ball"></span>
    <span class="note">&#9835;</span>
    <span class="mic"></span>
    <span class="star">&#9733;</span>
    <span aria-hidden="true">🎭</span>
    <span class="heart">&#9829;</span>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Kids bathroom", "Walls (ask mom)"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Kitchen bathroom", "Vacuum basement"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Basement bathroom", "Dress up room"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Garbages"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Van", "Vacuum main floor"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Garage", "Dirty socks", "Match 5 pairs of socks"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
