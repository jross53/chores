<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #d4bf9e;
          background:
                  radial-gradient(circle at 12% 10%, rgba(247, 240, 227, 0.95), transparent 35%),
                  radial-gradient(circle at 88% 12%, rgba(138, 107, 71, 0.45), transparent 34%),
                  linear-gradient(165deg, #f7f0e3 0%, #ece0c8 28%, #d4bf9e 62%, #8a6b47 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(61, 42, 26, 0.28);
          background: rgba(61, 42, 26, 0.28);
          border: 2px solid rgba(247, 240, 227, 0.85);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(60, 40, 20, 0.28);
      }

      .headline-note {
          margin: 6px 0 0;
          font-family: "Fredoka", sans-serif;
          font-style: italic;
          font-size: 1.35rem;
          font-weight: 600;
          color: #ffffff;
          letter-spacing: 0.02em;
      }

      .season-badge {
          display: inline-block;
          border-radius: 999px;
          background-color: #6b4a2f;
          background: linear-gradient(135deg, #4a6b8a, #6b4a2f);
          color: #fff8f0;
          border: 2px solid rgba(255, 255, 255, 0.95);
          box-shadow: 0 6px 16px rgba(60, 40, 20, 0.35);
          padding: 9px 18px;
          margin-bottom: 10px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          letter-spacing: 0.04em;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(60, 40, 20, 0.4);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 6px;
          font-size: 0.85em;
          vertical-align: baseline;
      }

      .title-logo {
          display: block;
          height: 90px;
          width: auto;
          margin: 0 auto 6px;
          border-radius: 8px;
          box-shadow: 0 4px 10px rgba(60, 40, 20, 0.35);
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffef8;
          border: 4px solid #6b4a2f;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(60, 40, 20, 0.28);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #3d2a1a;
          box-shadow: 0 6px 16px rgba(60, 40, 20, 0.25);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #3d2a1a;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffef4;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(60, 40, 20, 0.2);
          font-size: 1rem;
          font-weight: 600;
          color: #3d2a1a;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(60, 40, 20, 0.4);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(60, 40, 20, 0.2);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #3d2a1a;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .season-badge {
              padding: 8px 14px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <img src="newsies-logo.png" alt="Newsies logo" class="title-logo">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true">🗞️</span>Ross Family Chores<span class="title-icon" aria-hidden="true">🗞️</span></h1>
    <p class="headline-note">Extra! Extra! Brooklyn's in Newsies! 🗞️</p>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Garbages", "Your room"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Windows in kitchen and living room", "Shutters", "Your room"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Kids bathroom", "Your room"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kitchen bathroom", "Your room"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Van", "Your room"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Pantry", "Your room"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket", "Your room"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
