<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ross Family Chores - Snow Day Edition</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
      :root {
          --sky-top: #5e7892;
          --sky-bottom: #dce8f3;
          --snow: #f7fbff;
          --snow-shadow: #d2dfec;
          --ice-line: rgba(255, 255, 255, 0.72);
          --card-top: rgba(255, 255, 255, 0.94);
          --card-bottom: rgba(232, 241, 249, 0.92);
          --ink: #1d3550;
          --muted: #59718a;
          --accent: #7bb6de;
          --accent-deep: #2f5d87;
          --glow: rgba(255, 255, 255, 0.95);
      }

      body {
          font-family: "Manrope", sans-serif;
          background:
              radial-gradient(circle at top, rgba(255, 255, 255, 0.32), transparent 38%),
              linear-gradient(180deg, #5b7690 0%, #88a5bd 32%, #bed2e1 62%, #edf5fb 100%);
          padding: 14px 14px 20px;
          margin: 0;
          min-height: 100vh;
          position: relative;
          overflow-x: hidden;
          color: var(--ink);
      }

      body::before,
      body::after {
          content: "";
          position: fixed;
          left: 0;
          width: 100%;
          pointer-events: none;
      }

      body::before {
          inset: 0;
          background:
              radial-gradient(circle at 10% 14%, rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 2px, transparent 3px),
              radial-gradient(circle at 28% 22%, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 1px, transparent 2px),
              radial-gradient(circle at 44% 8%, rgba(255,255,255,0.2) 0, rgba(255,255,255,0.2) 2px, transparent 3px),
              radial-gradient(circle at 64% 18%, rgba(255,255,255,0.17) 0, rgba(255,255,255,0.17) 1px, transparent 2px),
              radial-gradient(circle at 82% 10%, rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 2px, transparent 3px),
              linear-gradient(180deg, rgba(255,255,255,0.16), transparent 40%);
          z-index: 0;
          opacity: 0.9;
      }

      body::after {
          bottom: 0;
          height: 24vh;
          background:
              radial-gradient(circle at 12% 100%, rgba(247, 251, 255, 0.98) 0, rgba(247, 251, 255, 0.98) 18%, transparent 19%),
              radial-gradient(circle at 34% 100%, rgba(242, 248, 253, 0.98) 0, rgba(242, 248, 253, 0.98) 20%, transparent 21%),
              radial-gradient(circle at 57% 100%, rgba(247, 251, 255, 0.98) 0, rgba(247, 251, 255, 0.98) 20%, transparent 21%),
              radial-gradient(circle at 79% 100%, rgba(240, 247, 252, 0.98) 0, rgba(240, 247, 252, 0.98) 18%, transparent 19%),
              radial-gradient(circle at 96% 100%, rgba(247, 251, 255, 0.98) 0, rgba(247, 251, 255, 0.98) 14%, transparent 15%);
          z-index: 0;
      }

      h1 {
          font-family: "Fraunces", serif;
          font-size: 3.7rem;
          text-align: center;
          color: #f9fdff;
          margin: 0;
          letter-spacing: 0.03em;
          text-shadow: 0 10px 28px rgba(22, 43, 64, 0.32);
      }

      .hero {
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 1680px;
          margin: 0 auto 10px;
          padding: 8px 10px 2px;
      }

      .hero-panel {
          padding: 14px 20px;
          border-radius: 24px;
          background:
              linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.12)),
              linear-gradient(135deg, rgba(118, 155, 183, 0.68), rgba(66, 95, 125, 0.76));
          border: 1px solid rgba(255, 255, 255, 0.28);
          box-shadow: 0 24px 54px rgba(28, 49, 71, 0.2);
          backdrop-filter: blur(12px);
          display: block;
      }

      .floating-symbol {
          position: fixed;
          top: -10px;
          color: var(--glow);
          font-size: 1rem;
          pointer-events: none;
          -webkit-animation: drift linear infinite;
          animation: drift linear infinite;
          opacity: 0.65;
          z-index: 2;
          text-shadow: 0 2px 10px rgba(255,255,255,0.4);
      }

      @-webkit-keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          20% { opacity: 0.82; }
          100% {
              -webkit-transform: translateY(100vh) translateX(28px) rotate(16deg);
              transform: translateY(100vh) translateX(28px) rotate(16deg);
              opacity: 0.1;
          }
      }

      @keyframes drift {
          0% {
              -webkit-transform: translateY(-10px) translateX(0);
              transform: translateY(-10px) translateX(0);
              opacity: 0;
          }
          20% { opacity: 0.82; }
          100% {
              -webkit-transform: translateY(100vh) translateX(28px) rotate(16deg);
              transform: translateY(100vh) translateX(28px) rotate(16deg);
              opacity: 0.1;
          }
      }

      .chores-container {
          position: relative;
          z-index: 1;
          text-align: initial;
          max-width: 1680px;
          margin: 0 auto;
          padding: 10px 10px 6px;
          overflow: hidden;
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 14px;
          align-items: stretch;
      }

      .chore-card {
          background:
              linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.4)),
              linear-gradient(180deg, var(--card-top), var(--card-bottom));
          border-radius: 28px;
          -webkit-border-radius: 28px;
          padding: 14px 14px 16px;
          box-shadow: 0 18px 34px rgba(40, 67, 94, 0.16);
          -webkit-box-shadow: 0 18px 34px rgba(40, 67, 94, 0.16);
          border: 1px solid rgba(211, 226, 238, 0.95);
          -webkit-transition: transform 0.25s ease, box-shadow 0.25s ease;
          transition: transform 0.25s ease, box-shadow 0.25s ease;
          width: auto;
          margin: 0;
          display: block;
          text-align: left;
          position: relative;
          overflow: hidden;
          min-height: 0;
      }

      .chore-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background:
              linear-gradient(135deg, rgba(255,255,255,0.42), transparent 38%),
              radial-gradient(circle at top right, rgba(123, 182, 222, 0.22), transparent 28%);
          pointer-events: none;
      }

      .chore-card::after {
          content: "";
          position: absolute;
          left: 14px;
          right: 14px;
          top: 0;
          height: 8px;
          border-radius: 999px;
          background: linear-gradient(90deg, rgba(123, 182, 222, 0.25), rgba(255,255,255,0.95), rgba(123, 182, 222, 0.25));
      }

      .chore-card:hover {
          -webkit-transform: translateY(-3px);
          transform: translateY(-3px);
          box-shadow: 0 22px 38px rgba(40, 67, 94, 0.2);
          -webkit-box-shadow: 0 22px 38px rgba(40, 67, 94, 0.2);
      }

      .dance-card {
          -webkit-animation: hazel-dance 1.4s ease-in-out 1;
          animation: hazel-dance 1.4s ease-in-out 1;
          -webkit-transform-origin: center bottom;
          transform-origin: center bottom;
      }

      @-webkit-keyframes hazel-dance {
          0%, 100% { -webkit-transform: translateX(0) rotate(0deg); transform: translateX(0) rotate(0deg); }
          10% { -webkit-transform: translateX(-4px) rotate(-2deg); transform: translateX(-4px) rotate(-2deg); }
          20% { -webkit-transform: translateX(4px) rotate(2deg) translateY(-3px); transform: translateX(4px) rotate(2deg) translateY(-3px); }
          35% { -webkit-transform: translateX(-6px) rotate(-3deg); transform: translateX(-6px) rotate(-3deg); }
          50% { -webkit-transform: translateX(6px) rotate(3deg) translateY(-5px); transform: translateX(6px) rotate(3deg) translateY(-5px); }
          65% { -webkit-transform: translateX(-3px) rotate(-1deg); transform: translateX(-3px) rotate(-1deg); }
          80% { -webkit-transform: translateX(3px) rotate(1deg) translateY(-2px); transform: translateX(3px) rotate(1deg) translateY(-2px); }
      }

      @keyframes hazel-dance {
          0%, 100% { -webkit-transform: translateX(0) rotate(0deg); transform: translateX(0) rotate(0deg); }
          10% { -webkit-transform: translateX(-4px) rotate(-2deg); transform: translateX(-4px) rotate(-2deg); }
          20% { -webkit-transform: translateX(4px) rotate(2deg) translateY(-3px); transform: translateX(4px) rotate(2deg) translateY(-3px); }
          35% { -webkit-transform: translateX(-6px) rotate(-3deg); transform: translateX(-6px) rotate(-3deg); }
          50% { -webkit-transform: translateX(6px) rotate(3deg) translateY(-5px); transform: translateX(6px) rotate(3deg) translateY(-5px); }
          65% { -webkit-transform: translateX(-3px) rotate(-1deg); transform: translateX(-3px) rotate(-1deg); }
          80% { -webkit-transform: translateX(3px) rotate(1deg) translateY(-2px); transform: translateX(3px) rotate(1deg) translateY(-2px); }
      }

      .kid-profile {
          margin-bottom: 10px;
          overflow: hidden;
          padding-top: 12px;
          position: relative;
          z-index: 1;
      }

      .kid-avatar {
          width: 62px;
          height: 62px;
          border-radius: 50%;
          -webkit-border-radius: 50%;
          object-fit: cover;
          border: 4px solid rgba(255,255,255,0.95);
          box-shadow: 0 10px 18px rgba(69, 95, 122, 0.2);
          -webkit-box-shadow: 0 10px 18px rgba(69, 95, 122, 0.2);
          float: left;
          margin-right: 12px;
      }

      .kid-name {
          font-family: "Fraunces", serif;
          font-size: 1.38rem;
          font-weight: 600;
          padding: 7px 12px;
          border-radius: 16px;
          -webkit-border-radius: 16px;
          color: #fffef9;
          display: inline-block;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 10px 20px rgba(76, 104, 133, 0.18);
          -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 10px 20px rgba(76, 104, 133, 0.18);
          margin-top: 10px;
          letter-spacing: 0.02em;
      }

      .Ellie { background: linear-gradient(135deg, #88b7d2, #5f8dad); }
      .Brooklyn { background: linear-gradient(135deg, #6ea7c6, #4e7e9e); }
      .Hazel { background: linear-gradient(135deg, #9fc6d9, #6f9fb6); }
      .Maverick { background: linear-gradient(135deg, #7ca7b7, #567f90); }
      .Hinckley { background: linear-gradient(135deg, #7f99c1, #5d76a4); }
      .Adaline { background: linear-gradient(135deg, #9ab8cf, #6c8faa); }
      .Raleigh { background: linear-gradient(135deg, #88a4bc, #627f99); }

      ul {
          margin: 0;
          padding-left: 20px;
      }

      li {
          margin-bottom: 8px;
          font-size: 0.98rem;
          line-height: 1.25;
          word-wrap: break-word;
      }

      .chore-list-title {
          font-family: "Manrope", sans-serif;
          font-size: 0.76rem;
          color: var(--muted);
          margin-bottom: 8px;
          text-transform: uppercase;
          letter-spacing: 0.18em;
          font-weight: 800;
      }

      .rotation-label {
          display: block;
          margin: 10px 0 8px;
          position: relative;
          z-index: 1;
      }

      .rotation-zone {
          font-size: 0.72rem;
          font-weight: 800;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--accent-deep);
      }

      .quote-section {
          position: relative;
          z-index: 1;
          text-align: center;
          margin: 12px auto 0;
          padding: 14px 18px 12px;
          max-width: 1320px;
          background: rgba(244, 249, 253, 0.72);
          border: 1px solid rgba(255,255,255,0.72);
          border-radius: 24px;
          -webkit-border-radius: 24px;
          backdrop-filter: blur(10px);
          box-shadow: 0 14px 30px rgba(49, 77, 105, 0.12);
      }

      .quote {
          font-family: "Fraunces", serif;
          font-size: 1.24rem;
          color: var(--ink);
          margin-bottom: 4px;
      }

      .quote-author {
          font-family: "Manrope", sans-serif;
          font-size: 0.78rem;
          color: var(--muted);
          font-weight: 700;
          text-shadow: none;
      }

      @media (max-width: 1400px) {
          .chores-container {
              grid-template-columns: repeat(3, minmax(0, 1fr));
          }
      }

      @media (max-width: 720px) {
          h1 {
              font-size: 2.9rem;
          }

          .chore-card {
              width: auto;
              display: block;
              margin: 10px auto;
              max-width: 340px;
          }

          .chores-container {
              display: block;
          }
      }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-panel">
    <h1>Ross Family Chores</h1>
  </div>
</div>

<div class="chores-container" id="choresContainer">
  <!-- Cards will be generated by JavaScript -->
</div>

<div class="quote-section">
  <div class="quote">"Even the strongest blizzards start with one snowflake at a time."</div>
  <div class="quote-author">Snow day rule: finish your part and the whole house feels better.</div>
</div>

<script>
  var DANCE_DURATION_MS = 1400;
  var DANCE_PAUSE_MS = 3000;
  var danceTimerId = null;

  var KIDS = [
    { name: "Ellie", position: "Outside Hitter", zone: "Zone 4", intensity: "Match Point", chores: ["Softball"] },
    { name: "Brooklyn", position: "Setter", zone: "Zone 2", intensity: "Quick Tempo", chores: ["Garbages", "Microwave inside and out"] },
    { name: "Hazel", position: "Libero", zone: "Zone 5", intensity: "All-Out Save", chores: ["Kitchen bathroom", "Stainless steel"] },
    { name: "Maverick", position: "Middle Blocker", zone: "Zone 3", intensity: "Big Block", chores: ["Weapon bin", "White toy shelf"] },
    { name: "Hinckley", position: "Defensive Specialist", zone: "Zone 6", intensity: "Floor Burn", chores: ["Kids bathroom"] },
    { name: "Adaline", position: "Right Side", zone: "Zone 1", intensity: "Strong Finish", chores: ["Shoe basket", "Pantry"] },
    { name: "Raleigh", position: "Serving Sub", zone: "Service Line", intensity: "Clutch Serve", chores: ["Shoe basket", "Scrub kitchen chairs"] }
  ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    // Clear existing cards safely
    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];

      // Create card
      var card = document.createElement("div");
      card.setAttribute("class", "chore-card");

      // Create profile section
      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      // Create avatar image
      var avatar = document.createElement("img");
      avatar.setAttribute("src", kid.name + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      // Create name badge
      var nameDiv = document.createElement("div");
      nameDiv.setAttribute("class", "kid-name " + kid.name);
      nameDiv.textContent = kid.name;

      profileDiv.appendChild(avatar);
      profileDiv.appendChild(nameDiv);

      // Create chores section
      var choresDiv = document.createElement("div");
      var rotationLabel = document.createElement("div");
      rotationLabel.setAttribute("class", "rotation-label");

      var rotationZone = document.createElement("div");
      rotationZone.setAttribute("class", "rotation-zone");
      rotationZone.textContent = "Today's list";

      rotationLabel.appendChild(rotationZone);
      choresDiv.appendChild(rotationLabel);

      var choreTitle = document.createElement("div");
      choreTitle.setAttribute("class", "chore-list-title");
      choreTitle.textContent = "Snow day checklist";
      choresDiv.appendChild(choreTitle);

      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");
        li.textContent = kid.chores[j];
        ul.appendChild(li);
      }
      choresDiv.appendChild(ul);

      // Assemble card
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  function startDanceRotation() {
    var cards = document.querySelectorAll(".chore-card");
    var danceIndex = 0;

    if (danceTimerId) {
      clearTimeout(danceTimerId);
      danceTimerId = null;
    }

    if (!cards.length) return;

    function queueNextDance() {
      var activeCard = cards[danceIndex];
      activeCard.classList.add("dance-card");

      danceTimerId = setTimeout(function() {
        activeCard.classList.remove("dance-card");
        danceIndex = (danceIndex + 1) % cards.length;
        danceTimerId = setTimeout(queueNextDance, DANCE_PAUSE_MS);
      }, DANCE_DURATION_MS);
    }

    queueNextDance();
  }

  renderTable();
  startDanceRotation();

  // Create gentle drifting snowflakes.
  try {
    var MAX_SYMBOLS = 18;
    var symbolCount = 0;
    var MIN_SYMBOL_SIZE_REM = 0.85;
    var MAX_SYMBOL_SIZE_REM = 2;
    var symbols = ['\u2744', '\u2745', '\u2746'];

    function createSymbol() {
      try {
        if (symbolCount >= MAX_SYMBOLS) {
          return;
        }
        if (typeof document.hidden !== 'undefined' && document.hidden) {
          return;
        }

        var symbol = document.createElement('div');
        symbol.setAttribute('class', 'floating-symbol');
        symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        symbol.style.left = Math.random() * 100 + 'vw';
        var duration = Math.random() * 4 + 6;
        symbol.style.animationDuration = duration + 's';
        symbol.style.fontSize = (Math.random() * (MAX_SYMBOL_SIZE_REM - MIN_SYMBOL_SIZE_REM) + MIN_SYMBOL_SIZE_REM) + 'rem';
        document.body.appendChild(symbol);
        symbolCount++;

        setTimeout(function() {
          if (symbol.parentNode) {
            symbol.parentNode.removeChild(symbol);
            symbolCount--;
          }
        }, (duration + 0.5) * 1000);
      } catch (e) {
        // Silently fail - animation is non-essential
      }
    }

    setInterval(createSymbol, 700);
  } catch (e) {
    // Animation not supported - table will still work
  }

</script>

</body>
</html>
