<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #8a4214;
          background:
                  radial-gradient(circle at 14% 12%, rgba(255, 244, 214, 0.75), transparent 32%),
                  radial-gradient(circle at 88% 86%, rgba(140, 31, 18, 0.5), transparent 38%),
                  linear-gradient(165deg, #ffeccb 0%, #f0a244 26%, #b3521a 60%, #4a2008 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(74, 32, 8, 0.55);
          background: rgba(74, 32, 8, 0.55);
          border: 2px solid rgba(255, 255, 255, 0.9);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(4, 20, 50, 0.32);
      }

      .season-badge {
          display: inline-block;
          border-radius: 999px;
          background-color: #a83f0e;
          background: linear-gradient(135deg, #e07a1f, #8c3208);
          color: #fffaf0;
          border: 2px solid rgba(255, 255, 255, 0.95);
          box-shadow: 0 6px 16px rgba(60, 26, 6, 0.4);
          padding: 9px 18px;
          margin-bottom: 10px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          letter-spacing: 0.04em;
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(60, 26, 6, 0.5);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 10px;
          width: 0.6em;
          height: 0.6em;
          vertical-align: middle;
          background-color: #f0a244;
          background: linear-gradient(135deg, #ffd166, #c2530e);
          border-radius: 0 70% 0 70%;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffdf5;
          border: 4px solid #c2530e;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(60, 26, 6, 0.32);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #7a3b12;
          box-shadow: 0 6px 16px rgba(60, 26, 6, 0.3);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #4a2410;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffdf5;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(60, 26, 6, 0.25);
          font-size: 1rem;
          font-weight: 600;
          color: #4a2410;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(122, 59, 18, 0.45);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(60, 26, 6, 0.25);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #4a2410;
      }

      .leaf-garland {
          text-align: center;
          margin-top: 16px;
          font-size: 26px;
          line-height: 1;
      }

      .leaf {
          display: inline-block;
          vertical-align: middle;
          margin: 0 0.3em;
          width: 2.2em;
          height: 2.2em;
          background-color: #c2530e;
          background: linear-gradient(135deg, #ffb85c, #a83f0e);
          border-radius: 0 70% 0 70%;
          box-shadow: 0 8px 16px rgba(60, 26, 6, 0.4);
      }

      .leaf-red {
          background-color: #98291a;
          background: linear-gradient(135deg, #e4643f, #8c1f12);
      }

      .leaf-gold {
          background-color: #d9a01a;
          background: linear-gradient(135deg, #ffdf8a, #c07d0a);
      }

      .leaf-small {
          width: 1.5em;
          height: 1.5em;
      }

      .acorn {
          display: inline-block;
          vertical-align: middle;
          margin: 0 0.3em;
          width: 1.5em;
          height: 1.8em;
          background-color: #8a5a2b;
          background: linear-gradient(180deg, #5c3a17 0%, #5c3a17 38%, #c08a4a 38%, #8a5a2b 100%);
          border-radius: 30% 30% 50% 50%;
          box-shadow: 0 8px 16px rgba(60, 26, 6, 0.4);
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .leaf-garland {
              font-size: 20px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .leaf-garland {
              font-size: 34px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .leaf-garland {
              font-size: 22px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .season-badge {
              padding: 8px 14px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .leaf-garland {
              margin-top: 10px;
              font-size: 15px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .leaf-garland {
              font-size: 16px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true"></span>Ross Family Chores<span class="title-icon" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="leaf-garland" aria-label="Autumn leaves">
    <span class="leaf leaf-small leaf-gold"></span>
    <span class="leaf leaf-red"></span>
    <span class="acorn"></span>
    <span class="leaf leaf-gold"></span>
    <span class="leaf"></span>
    <span class="leaf leaf-small leaf-red"></span>
    <span class="leaf"></span>
    <span class="leaf leaf-gold"></span>
    <span class="acorn"></span>
    <span class="leaf leaf-red"></span>
    <span class="leaf leaf-small leaf-gold"></span>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Kitchen bathroom", "Scrub white shutters"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Scoop poop", "Basement bathroom tub", "1 fridge shelf or drawer"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Garbages", "Match 10 pairs of socks"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Kids bathroom"] },
     { name: "Hinckley", color: "#5fd490", chores: ["White drawer set by computer"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Pantry", "Backpack", "Scooter"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket", "Vacuum basement"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
