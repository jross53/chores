<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #2a1840;
          background:
                  radial-gradient(circle at 88% 10%, rgba(255, 244, 200, 0.95), rgba(255, 230, 150, 0.55) 4%, transparent 9%),
                  radial-gradient(circle at 10% 18%, rgba(255, 255, 255, 0.5), transparent 0.5%),
                  radial-gradient(circle at 30% 8%, rgba(255, 255, 255, 0.45), transparent 0.4%),
                  radial-gradient(circle at 65% 14%, rgba(255, 255, 255, 0.45), transparent 0.4%),
                  radial-gradient(circle at 50% 100%, rgba(255, 120, 20, 0.45), transparent 50%),
                  linear-gradient(180deg, #120a24 0%, #2a1840 45%, #4a2350 80%, #6b2f3a 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: #e8661a;
          background: linear-gradient(90deg, rgba(232, 102, 26, 0.92), rgba(110, 44, 160, 0.92));
          border: 2px solid #ffb347;
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(20, 5, 30, 0.6);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 12px;
          vertical-align: middle;
          font-size: 0.6em;
      }

      .pumpkin {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 1.7em;
          height: 1.4em;
          background-color: #ff8a1f;
          background: radial-gradient(circle at 35% 30%, #ffc266 0%, #ff8a1f 55%, #c4520a 100%);
          border-radius: 50%;
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      }

      .pumpkin:before {
          content: "";
          position: absolute;
          left: 50%;
          top: -0.25em;
          width: 0.2em;
          height: 0.35em;
          margin-left: -0.1em;
          background-color: #4f7a28;
          border-radius: 0.05em;
      }

      .pumpkin:after {
          content: "";
          position: absolute;
          left: 30%;
          top: 0;
          width: 40%;
          height: 100%;
          border-left: 0.06em solid rgba(160, 60, 0, 0.45);
          border-right: 0.06em solid rgba(160, 60, 0, 0.45);
          border-radius: 50%;
          box-sizing: border-box;
      }

      .ghost {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 1.2em;
          height: 1.5em;
          background-color: #f6f3ff;
          border-radius: 0.6em 0.6em 0.15em 0.15em;
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      }

      .ghost:before,
      .ghost:after {
          content: "";
          position: absolute;
          top: 0.45em;
          width: 0.2em;
          height: 0.28em;
          background-color: #2a1840;
          border-radius: 50%;
      }

      .ghost:before {
          left: 0.28em;
      }

      .ghost:after {
          right: 0.28em;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fff8ef;
          border: 4px solid #ff8a1f;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #6e2ca0;
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #2e1838;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fff8ef;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
          font-size: 1rem;
          font-weight: 600;
          color: #2e1838;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 248, 239, 0.94);
          border: 2px solid rgba(232, 102, 26, 0.6);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #2e1838;
      }

      .photo-collage {
          text-align: center;
          margin-top: 14px;
      }

      .photo-bubble {
          display: inline-block;
          vertical-align: middle;
          width: 300px;
          height: 230px;
          overflow: hidden;
          border-radius: 16px;
          border: 3px solid #ff8a1f;
          background: #3a2350;
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
          margin: 5px 8px;
      }

      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 30%;
      }

      .halloween-garland {
          text-align: center;
          margin-top: 16px;
          font-size: 26px;
          line-height: 1;
      }

      .halloween-garland span {
          margin-left: 0.35em;
          margin-right: 0.35em;
          vertical-align: middle;
      }


      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .halloween-garland {
              font-size: 20px;
          }

          .photo-bubble {
              width: 200px;
              height: 150px;
              border-radius: 14px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .halloween-garland {
              font-size: 34px;
          }

          .photo-bubble {
              width: 380px;
              height: 285px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .halloween-garland {
              font-size: 22px;
          }

          .photo-bubble {
              width: 230px;
              height: 175px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .halloween-garland {
              margin-top: 10px;
              font-size: 15px;
          }

          .photo-collage {
              margin-top: 8px;
          }

          .photo-bubble {
              width: 260px;
              height: 195px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .halloween-garland {
              font-size: 16px;
          }

          .photo-bubble {
              width: 160px;
              height: 120px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon pumpkin" aria-hidden="true"></span>Ross Family Chores<span class="title-icon ghost" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="photo-collage" aria-label="Halloween photos">
    <div class="photo-bubble"><img src="halloween-1.jpg" alt="Family in Bible costumes by the Halloween fireplace"></div>
    <div class="photo-bubble"><img src="halloween-2.jpg" alt="Kids in costumes at trunk-or-treat with Prego mom"></div>
    <div class="photo-bubble"><img src="halloween-3.jpg" alt="Kids in costumes with pumpkins at trunk-or-treat"></div>
    <div class="photo-bubble"><img src="halloween-4.jpg" alt="Family dressed as Jack and Jill with the kids in costumes"></div>
  </section>
  <section class="halloween-garland" aria-label="Pumpkins, ghosts, bats and candy">
    <span class="pumpkin"></span>
    <span class="ghost"></span>
    <span aria-hidden="true">🦇</span>
    <span class="pumpkin"></span>
    <span aria-hidden="true">🕸</span>
    <span class="ghost"></span>
    <span aria-hidden="true">🍬</span>
    <span class="pumpkin"></span>
    <span aria-hidden="true">🦇</span>
    <span class="ghost"></span>
    <span class="pumpkin"></span>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Garbages", "Living room window sills"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Kids bathroom", "Vacuum and mop kids bathroom"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Vacuum and mop kitchen", "Sort a load of laundry"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Basement bathroom", "Vacuum and mop basement tile"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Kitchen bathroom", "Kitchen bathroom walls"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Coat closet", "Toothpaste on back of kids bathroom door"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket", "Kids bathroom walls"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
