<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #1e5a9c;
          background:
                  radial-gradient(circle at 14% 12%, rgba(232, 244, 255, 0.8), transparent 32%),
                  radial-gradient(circle at 88% 86%, rgba(232, 113, 10, 0.45), transparent 38%),
                  linear-gradient(165deg, #e8f4ff 0%, #6bb3ea 26%, #1e5a9c 60%, #0d2a52 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(13, 42, 82, 0.6);
          background: rgba(13, 42, 82, 0.6);
          border: 2px solid rgba(255, 255, 255, 0.9);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(4, 20, 50, 0.32);
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(4, 20, 50, 0.5);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 12px;
          vertical-align: middle;
      }

      .basketball {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 2em;
          height: 2em;
          background-color: #e8710a;
          background: linear-gradient(#2b1203, #2b1203) center / 0.07em 100% no-repeat,
                      radial-gradient(circle at 35% 30%, #ffa04d 0%, #e8710a 58%, #b34f05 100%);
          border-radius: 50%;
          box-shadow: 0 8px 16px rgba(4, 20, 50, 0.4);
      }

      .basketball:before {
          content: "";
          position: absolute;
          left: 0;
          top: 50%;
          width: 100%;
          height: 0.07em;
          margin-top: -0.035em;
          background-color: #2b1203;
      }

      .basketball:after {
          content: "";
          position: absolute;
          left: 16%;
          top: 0;
          width: 68%;
          height: 100%;
          border-left: 0.07em solid #2b1203;
          border-right: 0.07em solid #2b1203;
          border-radius: 50%;
      }

      .title-icon.basketball {
          font-size: 0.55em;
      }

      .paddle {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 1.9em;
          height: 1.9em;
          margin-bottom: 0.9em;
          background-color: #c8281e;
          background: radial-gradient(circle at 35% 30%, #ff6a5c 0%, #c8281e 60%, #8c150e 100%);
          border: 0.1em solid #5a2a0c;
          border-radius: 50%;
          box-shadow: 0 8px 16px rgba(4, 20, 50, 0.4);
          -webkit-transform: rotate(25deg);
          transform: rotate(25deg);
      }

      .paddle:after {
          content: "";
          position: absolute;
          left: 50%;
          top: 88%;
          width: 0.45em;
          height: 1.05em;
          margin-left: -0.225em;
          background-color: #c98a45;
          border-radius: 0 0 0.22em 0.22em;
          z-index: -1;
      }

      .pp-ball {
          display: inline-block;
          vertical-align: middle;
          width: 0.8em;
          height: 0.8em;
          background-color: #ffffff;
          background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f3f3f3 60%, #cfcfcf 100%);
          border-radius: 50%;
          box-shadow: 0 6px 12px rgba(4, 20, 50, 0.4);
      }

      .runner {
          display: inline-block;
          vertical-align: middle;
          margin: 0 0.3em;
          font-size: 1.8em;
          line-height: 1;
      }

      .sports-garland .basketball,
      .sports-garland .paddle {
          margin-left: 0.4em;
          margin-right: 0.4em;
      }

      .sports-garland .pp-ball {
          margin: 0 0.3em;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffdf5;
          border: 4px solid #e8710a;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.32);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #0d2a52;
          box-shadow: 0 6px 16px rgba(4, 20, 50, 0.3);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #12304f;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffdf5;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.25);
          font-size: 1rem;
          font-weight: 600;
          color: #12304f;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(13, 42, 82, 0.45);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(4, 20, 50, 0.25);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #12304f;
      }

      .sports-garland {
          text-align: center;
          margin-top: 16px;
          font-size: 26px;
          line-height: 1;
      }

      .birthday-collage {
          text-align: center;
          margin-top: 14px;
      }

      .photo-bubble {
          display: inline-block;
          vertical-align: middle;
          width: 220px;
          height: 260px;
          overflow: hidden;
          border-radius: 16px;
          border: 2px solid #e8710a;
          background: #fffef8;
          box-shadow: 0 10px 24px rgba(4, 20, 50, 0.28);
          margin: 5px;
      }

      .photo-bubble img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 15%;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .sports-garland {
              font-size: 20px;
          }

          .photo-bubble {
              width: 130px;
              height: 160px;
              border-radius: 14px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .sports-garland {
              font-size: 34px;
          }
          .photo-bubble {
              width: 190px;
              height: 235px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .sports-garland {
              font-size: 22px;
          }

          .photo-bubble {
              width: 170px;
              height: 200px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .sports-garland {
              margin-top: 10px;
              font-size: 15px;
          }

          .birthday-collage {
              margin-top: 8px;
          }

          .photo-bubble {
              width: 150px;
              height: 175px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .sports-garland {
              font-size: 16px;
          }

          .photo-bubble {
              width: 110px;
              height: 135px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon basketball" aria-hidden="true"></span>Ross Family Chores<span class="title-icon basketball" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="birthday-collage" aria-label="Birthday photos for Jordan">
    <div class="photo-bubble"><img src="jordan-bday-1.jpg" alt="Jordan with Marrie"></div>
    <div class="photo-bubble"><img src="jordan-bday-2.jpg" alt="Jordan with Ellie"></div>
    <div class="photo-bubble"><img src="jordan-bday-3.jpg" alt="Jordan with Brooklyn"></div>
    <div class="photo-bubble"><img src="jordan-bday-4.jpg" alt="Jordan with Hazel"></div>
    <div class="photo-bubble"><img src="jordan-bday-5.jpg" alt="Jordan with Maverick"></div>
    <div class="photo-bubble"><img src="jordan-bday-6.jpg" alt="Jordan with Hinckley"></div>
    <div class="photo-bubble"><img src="jordan-bday-7.jpg" alt="Jordan with Adaline"></div>
    <div class="photo-bubble"><img src="jordan-bday-8.jpg" alt="Jordan with Raleigh"></div>
  </section>
  <section class="sports-garland" aria-label="Basketballs, runners and ping pong">
    <span class="basketball"></span>
    <span class="runner" aria-hidden="true">🏃</span>
    <span class="paddle"></span>
    <span class="pp-ball"></span>
    <span class="basketball"></span>
    <span class="runner" aria-hidden="true">🏃</span>
    <span class="paddle"></span>
    <span class="pp-ball"></span>
    <span class="basketball"></span>
    <span class="runner" aria-hidden="true">🏃</span>
    <span class="paddle"></span>
    <span class="pp-ball"></span>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Piano room"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Basement bathroom", "Organize 1 kid game cupboard"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Garbages", "Match 10 pairs of socks"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Vacuum basement", "Vacuum landing"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Kitchen bathroom"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Kids bathroom"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Garage", "Pantry"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
