<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ross Family Chores</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          margin: 0;
          min-height: 100%;
      }

      body {
          font-family: "Inter", sans-serif;
          background-color: #6b2c3e;
          background:
                  radial-gradient(circle at 86% 10%, rgba(255, 236, 190, 0.55), transparent 22%),
                  radial-gradient(circle at 12% 92%, rgba(242, 177, 66, 0.55), transparent 40%),
                  linear-gradient(180deg, #2b1a3d 0%, #5a2647 30%, #9c3a35 62%, #d9822b 86%, #f2b142 100%);
          background-attachment: fixed;
          padding: 20px;
      }

      .page-shell {
          max-width: 1680px;
          margin: 0 auto;
      }

      .page-header {
          text-align: center;
          margin-bottom: 20px;
          background-color: rgba(43, 26, 61, 0.6);
          background: rgba(43, 26, 61, 0.6);
          border: 2px solid rgba(255, 240, 210, 0.9);
          border-radius: 14px;
          padding: 14px 14px 12px;
          box-shadow: 0 10px 24px rgba(30, 10, 20, 0.32);
      }

      .page-title {
          font-family: "Fredoka", sans-serif;
          font-size: 2.5rem;
          font-weight: 600;
          color: #ffffff;
          margin: 0 0 4px;
          text-shadow: 0 4px 8px rgba(30, 10, 20, 0.5);
          letter-spacing: 0;
      }

      .title-icon {
          display: inline-block;
          margin: 0 12px;
          vertical-align: middle;
      }

      .pumpkin {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 2.3em;
          height: 1.8em;
          margin-top: 0.4em;
          background-color: #e8740c;
          background: radial-gradient(circle at 35% 30%, #ffa548 0%, #e8740c 55%, #a84a06 100%);
          border-radius: 50%;
          box-shadow: 0 8px 16px rgba(30, 10, 20, 0.4);
      }

      .pumpkin:before {
          content: "";
          position: absolute;
          left: 50%;
          top: -0.35em;
          width: 0.28em;
          height: 0.5em;
          margin-left: -0.14em;
          background-color: #4f6b2a;
          border-radius: 0.08em 0.08em 0 0;
          -webkit-transform: rotate(12deg);
          transform: rotate(12deg);
      }

      .pumpkin:after {
          content: "";
          position: absolute;
          left: 28%;
          top: 2%;
          width: 44%;
          height: 96%;
          border-left: 0.08em solid rgba(122, 52, 4, 0.55);
          border-right: 0.08em solid rgba(122, 52, 4, 0.55);
          border-radius: 50%;
      }

      .pumpkin-white {
          background-color: #f3ead6;
          background: radial-gradient(circle at 35% 30%, #fffaf0 0%, #e6d8b8 60%, #bfae88 100%);
      }

      .pumpkin-white:after {
          border-left-color: rgba(140, 120, 80, 0.5);
          border-right-color: rgba(140, 120, 80, 0.5);
      }

      .pumpkin-small {
          font-size: 0.75em;
      }

      .title-icon.pumpkin {
          font-size: 0.5em;
      }

      .apple {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 1.5em;
          height: 1.4em;
          margin-top: 0.3em;
          background-color: #c0262d;
          background: radial-gradient(circle at 35% 30%, #ff6b5e 0%, #c0262d 60%, #7d1218 100%);
          border-radius: 50% 50% 46% 46%;
          box-shadow: 0 8px 16px rgba(30, 10, 20, 0.4);
      }

      .apple:before {
          content: "";
          position: absolute;
          left: 50%;
          top: -0.3em;
          width: 0.1em;
          height: 0.4em;
          margin-left: -0.05em;
          background-color: #5a3418;
      }

      .apple:after {
          content: "";
          position: absolute;
          left: 54%;
          top: -0.32em;
          width: 0.45em;
          height: 0.25em;
          background-color: #5f8a2e;
          border-radius: 0 100% 0 100%;
      }

      .hay {
          display: inline-block;
          vertical-align: middle;
          position: relative;
          width: 2.4em;
          height: 1.5em;
          background-color: #d9a93f;
          background: repeating-linear-gradient(0deg, #e3b752 0, #e3b752 0.18em, #c9963a 0.18em, #c9963a 0.24em);
          border-radius: 0.3em;
          box-shadow: 0 8px 16px rgba(30, 10, 20, 0.4);
      }

      .hay:before,
      .hay:after {
          content: "";
          position: absolute;
          top: 0;
          width: 0.1em;
          height: 100%;
          background-color: #7a4a1c;
      }

      .hay:before {
          left: 26%;
      }

      .hay:after {
          right: 26%;
      }

      .harvest-row .pumpkin,
      .harvest-row .apple,
      .harvest-row .hay {
          margin-left: 0.35em;
          margin-right: 0.35em;
      }

      .chores-container {
          text-align: center;
          margin: 0;
      }

      .chore-card {
          width: 24%;
          margin: 0 0.5% 12px;
          display: inline-block;
          vertical-align: top;
          text-align: left;
          background-color: #fffdf5;
          border: 4px solid #a8322b;
          border-radius: 16px;
          padding: 18px;
          box-shadow: 0 8px 18px rgba(30, 10, 20, 0.32);
      }

      .kid-profile {
          display: table;
          width: 100%;
          margin-bottom: 14px;
          table-layout: fixed;
      }

      .kid-avatar {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          object-fit: cover;
          border: 4px solid #3d2350;
          box-shadow: 0 6px 16px rgba(30, 10, 20, 0.3);
          display: table-cell;
          vertical-align: middle;
      }

      .kid-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 12px;
      }

      .kid-name {
          font-family: "Fredoka", sans-serif;
          font-size: 1.7rem;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 40px;
          color: white;
          display: inline-block;
          box-shadow: 0 4px 8px rgba(0,0,0,0.24);
          margin: 0;
          word-break: break-word;
      }

      ul {
          list-style: none;
          margin: 0;
          padding: 0;
      }

      li {
          display: table;
          width: 100%;
          margin-bottom: 9px;
          font-size: 1.15rem;
          line-height: 1.28;
          font-weight: 600;
          word-break: break-word;
          color: #3b2314;
      }

      li:last-child {
          margin-bottom: 0;
      }

      .chore-bullet {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          display: table-cell;
          text-align: center;
          vertical-align: middle;
          color: white;
          font-size: 0.9rem;
          font-weight: 700;
          box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      }

      .chore-text {
          display: table-cell;
          vertical-align: middle;
          padding-left: 10px;
      }

      .empty-state {
          background: #fffdf5;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 8px 18px rgba(30, 10, 20, 0.25);
          font-size: 1rem;
          font-weight: 600;
          color: #3b2314;
      }

      .bottom-note {
          margin-top: 14px;
          text-align: center;
          background-color: rgba(255, 255, 255, 0.92);
          border: 2px solid rgba(61, 35, 80, 0.45);
          border-radius: 14px;
          padding: 14px 16px;
          box-shadow: 0 8px 18px rgba(30, 10, 20, 0.25);
          font-family: "Fredoka", sans-serif;
          font-size: 1.25rem;
          font-weight: 600;
          color: #3b2314;
      }

      .harvest-row {
          text-align: center;
          margin-top: 16px;
          font-size: 26px;
          line-height: 1;
      }

      @media (min-width: 1100px) and (orientation: landscape) {
          body {
              padding: 12px 12px 16px;
          }

          .page-title {
              font-size: 2.35rem;
          }

          .chores-container {
              margin: 0;
          }

          .chore-card {
              width: 24%;
              margin: 0 0.5% 10px;
              padding: 16px;
          }

          .kid-avatar {
              width: 68px;
              height: 68px;
          }

          .kid-name {
              font-size: 1.55rem;
          }

          li {
              margin-bottom: 8px;
              font-size: 1.05rem;
          }

          .chore-bullet {
              width: 26px;
              height: 26px;
              font-size: 0.8rem;
          }

          .harvest-row {
              font-size: 20px;
          }
      }

      @media (min-width: 1100px) and (orientation: landscape) and (min-height: 850px) {
          .harvest-row {
              font-size: 34px;
          }
      }

      @media (max-width: 1100px) {
          .chore-card {
              width: 49%;
              margin: 0 0.5% 12px;
          }

          .harvest-row {
              font-size: 22px;
          }
      }

      @media (max-width: 640px) {
          body {
              padding: 12px 10px 18px;
          }

          .page-header {
              padding: 10px 10px 12px;
          }

          .page-title {
              font-size: 1.8rem;
          }

          .chores-container {
              margin: 0;
              text-align: left;
          }

          .chore-card {
              width: 100%;
              display: block;
              margin: 0 0 12px;
          }

          .harvest-row {
              margin-top: 10px;
              font-size: 15px;
          }
      }

      @media (max-height: 700px) {
          .page-title {
              font-size: 1.85rem;
          }

          .kid-avatar {
              width: 56px;
              height: 56px;
          }

          .kid-name {
              font-size: 1.3rem;
          }

          li {
              font-size: 0.9rem;
          }

          .harvest-row {
              font-size: 16px;
          }
      }
  </style>
</head>
<body>
<div class="page-shell">
  <section class="page-header">
    <h1 class="page-title"><span class="title-icon pumpkin" aria-hidden="true"></span>Ross Family Chores<span class="title-icon pumpkin" aria-hidden="true"></span></h1>
  </section>

  <div class="chores-container" id="choresContainer"></div>
<!--  Uncomment the message below when needed-->
<!--  <div class="bottom-note">Please get at least 1 chore done on Friday</div>-->
  <section class="harvest-row" aria-label="Pumpkins, apples and hay bales">
    <span class="hay"></span>
    <span class="pumpkin pumpkin-small"></span>
    <span class="apple"></span>
    <span class="pumpkin"></span>
    <span class="pumpkin pumpkin-white pumpkin-small"></span>
    <span class="hay"></span>
    <span class="apple"></span>
    <span class="pumpkin"></span>
    <span class="pumpkin pumpkin-small"></span>
    <span class="apple"></span>
    <span class="pumpkin pumpkin-white"></span>
    <span class="hay"></span>
  </section>
</div>

  <script>
   var KIDS = [
     { name: "Ellie", color: "#ff6f91", chores: ["Kids bathroom", "Walls (ask mom)"] },
     { name: "Brooklyn", color: "#ff9671", chores: ["Kitchen bathroom", "Vacuum basement"] },
     { name: "Hazel", color: "#ffc75f", textColor: "#333", chores: ["Basement bathroom", "Dress up room"] },
     { name: "Mav", avatarName: "Maverick", color: "#f9a825", chores: ["Garbages"] },
     { name: "Hinckley", color: "#5fd490", chores: ["Van", "Vacuum main floor"] },
     { name: "Adaline", color: "#6ec6ff", chores: ["Garage", "Dirty socks", "Match 5 pairs of socks"] },
     { name: "Raleigh", color: "#b97fdb", chores: ["Shoe basket"] }
   ];

  function renderTable() {
    var container = document.getElementById("choresContainer");
    if (!container) return;

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }

    if (!KIDS.length) {
      var emptyState = document.createElement("div");
      emptyState.setAttribute("class", "empty-state");
      emptyState.textContent = "No chores assigned.";
      container.appendChild(emptyState);
      return;
    }

    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var card = document.createElement("section");
      card.setAttribute("class", "chore-card");

      var profileDiv = document.createElement("div");
      profileDiv.setAttribute("class", "kid-profile");

      var avatar = document.createElement("img");
      avatar.setAttribute("src", (kid.avatarName || kid.name) + ".png");
      avatar.setAttribute("alt", kid.name + " avatar");
      avatar.setAttribute("class", "kid-avatar");

      var textWrap = document.createElement("div");
      textWrap.setAttribute("class", "kid-text");

      var nameDiv = document.createElement("h2");
      nameDiv.setAttribute("class", "kid-name");
      nameDiv.style.background = kid.color;
      nameDiv.style.color = kid.textColor || "white";
      nameDiv.textContent = kid.name;

      textWrap.appendChild(nameDiv);
      profileDiv.appendChild(avatar);
      profileDiv.appendChild(textWrap);

      var choresDiv = document.createElement("div");
      var ul = document.createElement("ul");
      for (var j = 0; j < kid.chores.length; j++) {
        var li = document.createElement("li");

        var bullet = document.createElement("span");
        bullet.setAttribute("class", "chore-bullet");
        bullet.style.background = kid.color;
        bullet.style.color = kid.textColor || "white";
        bullet.textContent = j + 1;

        var choreText = document.createElement("span");
        choreText.setAttribute("class", "chore-text");
        choreText.textContent = kid.chores[j];

        li.appendChild(bullet);
        li.appendChild(choreText);
        ul.appendChild(li);
      }

      choresDiv.appendChild(ul);
      card.appendChild(profileDiv);
      card.appendChild(choresDiv);
      container.appendChild(card);
    }
  }

  renderTable();
</script>
</body>
</html>
